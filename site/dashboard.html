<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="고래영어 학원 대시보드 - 학생 관리, 출석 체크, 월간 캘린더">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐋</text></svg>">
  <link rel="manifest" href="manifest.json">
  <title>고래영어 대시보드</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #f8fafc;
      color: #1e293b;
      line-height: 1.6;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e2e8f0; }
    }

    /* 레이아웃 */
    .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
    header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 16px 0;
      sticky: top;
      z-index: 10;
    }
    @media (prefers-color-scheme: dark) {
      header { background: #1e293b; border-color: #334155; }
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .logo { font-size: 28px; }
    .header-title { font-size: 20px; font-weight: 600; }
    .header-date { font-size: 13px; color: #64748b; }
    @media (prefers-color-scheme: dark) {
      .header-date { color: #94a3b8; }
    }

    /* 탭 */
    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 24px;
      overflow-x: auto;
    }
    @media (prefers-color-scheme: dark) {
      .tabs { border-color: #334155; }
    }
    .tab-btn {
      padding: 12px 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #64748b;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }
    @media (prefers-color-scheme: dark) {
      .tab-btn { color: #94a3b8; }
    }
    .tab-btn.active {
      color: #2563eb;
      border-bottom-color: #2563eb;
    }
    .tab-btn:hover { color: #475569; }

    /* 콘텐츠 */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 카드 */
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      .card { background: #1e293b; border-color: #334155; }
    }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }

    /* 학생 목록 */
    .student-list {
      display: grid;
      gap: 12px;
    }
    .student-item {
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      border-left: 4px solid #2563eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    @media (prefers-color-scheme: dark) {
      .student-item { background: #334155; }
    }
    .student-name { font-weight: 600; }
    .student-info { font-size: 12px; color: #64748b; margin-top: 4px; }
    @media (prefers-color-scheme: dark) {
      .student-info { color: #94a3b8; }
    }
    .badge {
      padding: 4px 8px;
      background: #dbeafe;
      color: #1e40af;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      .badge { background: #1e3a8a; color: #93c5fd; }
    }

    /* 출석 현황 */
    .attendance-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
    }
    .attendance-item {
      padding: 16px;
      background: #f8fafc;
      border-radius: 8px;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      .attendance-item { background: #334155; }
    }
    .attendance-status {
      font-size: 28px;
      margin: 8px 0;
    }
    .attendance-name { font-size: 12px; color: #64748b; }
    @media (prefers-color-scheme: dark) {
      .attendance-name { color: #94a3b8; }
    }

    /* 캘린더 */
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .calendar-day {
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    @media (prefers-color-scheme: dark) {
      .calendar-day { background: #334155; }
    }
    .calendar-day.today {
      background: #2563eb;
      color: white;
      font-weight: 600;
    }
    .calendar-day.event {
      background: #fef08a;
      color: #713f12;
    }
    @media (prefers-color-scheme: dark) {
      .calendar-day.event { background: #854d0e; color: #fef08a; }
    }

    /* 로딩 */
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
    }
    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 에러 */
    .error {
      padding: 16px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    @media (prefers-color-scheme: dark) {
      .error { background: #7f1d1d; color: #fca5a5; }
    }

    /* 통계 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-box {
      padding: 16px;
      background: #f8fafc;
      border-radius: 8px;
    }
    @media (prefers-color-scheme: dark) {
      .stat-box { background: #334155; }
    }
    .stat-label { font-size: 12px; color: #64748b; margin-bottom: 8px; }
    @media (prefers-color-scheme: dark) {
      .stat-label { color: #94a3b8; }
    }
    .stat-value { font-size: 24px; font-weight: 700; color: #2563eb; }

    /* 반응형 */
    @media (max-width: 640px) {
      .container { padding: 12px; }
      .header-content { flex-direction: column; gap: 8px; align-items: flex-start; }
      .header-title { font-size: 18px; }
      .attendance-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<header>
  <div class="container">
    <div class="header-content">
      <div class="header-left">
        <span class="logo">🐋</span>
        <div>
          <div class="header-title">고래영어 대시보드</div>
          <div class="header-date" id="today-date"></div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" data-tab="dashboard">대시보드</button>
    <button class="tab-btn" data-tab="students">학생 목록</button>
    <button class="tab-btn" data-tab="attendance">출석 현황</button>
    <button class="tab-btn" data-tab="calendar">월간 캘린더</button>
  </div>

  <!-- 대시보드 탭 -->
  <div id="dashboard" class="tab-content active">
    <div id="dashboard-error"></div>

    <div class="stats-grid" id="stats-container">
      <div class="stat-box">
        <div class="stat-label">등록된 학생</div>
        <div class="stat-value" id="stat-students">-</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">오늘 출석</div>
        <div class="stat-value" id="stat-attendance">-</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">이번 달 행사</div>
        <div class="stat-value" id="stat-events">-</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📅 이번 주 일정</div>
      <div id="calendar-preview" class="loading">
        <div class="spinner"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">👥 최근 학생</div>
      <div id="recent-students" class="loading">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <!-- 학생 탭 -->
  <div id="students" class="tab-content">
    <div class="card">
      <div class="card-title">📚 학생 목록</div>
      <div id="students-error"></div>
      <div id="students-list" class="student-list loading">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <!-- 출석 탭 -->
  <div id="attendance" class="tab-content">
    <div class="card">
      <div class="card-title">✓ 오늘 출석 현황</div>
      <div id="attendance-error"></div>
      <div id="attendance-list" class="attendance-grid loading">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <!-- 캘린더 탭 -->
  <div id="calendar" class="tab-content">
    <div class="card">
      <div class="card-title" id="calendar-title">📅 캘린더</div>
      <div id="calendar-error"></div>
      <div id="calendar-grid" class="calendar loading">
        <div class="spinner"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://hello-world.a28008005.workers.dev';

  // 날짜 표시
  function updateDate() {
    const today = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('today-date').textContent = today.toLocaleDateString('ko-KR', options);
  }

  // API 호출
  async function fetchAPI(endpoint) {
    try {
      const response = await fetch(`${API_URL}/api${endpoint}`);
      if (!response.ok) throw new Error(`API error: ${response.status}`);
      return await response.json();
    } catch (error) {
      console.error(error);
      return null;
    }
  }

  // 학생 목록 로드
  async function loadStudents() {
    const result = await fetchAPI('/students');
    const container = document.getElementById('students-list');

    if (!result || !result.success) {
      container.innerHTML = '<div class="error">학생 데이터를 불러올 수 없습니다</div>';
      return;
    }

    const students = result.data || [];
    if (students.length === 0) {
      container.innerHTML = '<div style="text-align: center; padding: 40px; color: #64748b;">학생이 없습니다</div>';
      return;
    }

    document.getElementById('stat-students').textContent = students.length;

    container.innerHTML = students.map(student => `
      <div class="student-item">
        <div>
          <div class="student-name">${student.name}</div>
          <div class="student-info">${student.grade} · ${student.status}</div>
        </div>
        <span class="badge">${student.status}</span>
      </div>
    `).join('');

    // 최근 학생
    const recent = students.slice(0, 3);
    document.getElementById('recent-students').innerHTML = recent.map(s => `
      <div class="student-item">
        <div>
          <div class="student-name">${s.name}</div>
          <div class="student-info">${s.grade}</div>
        </div>
      </div>
    `).join('');
  }

  // 출석 현황 로드
  async function loadAttendance() {
    const result = await fetchAPI('/attendance/today');
    const container = document.getElementById('attendance-list');

    if (!result || !result.success) {
      container.innerHTML = '<div class="error">출석 데이터를 불러올 수 없습니다</div>';
      return;
    }

    const attendance = result.data || [];
    document.getElementById('stat-attendance').textContent = attendance.filter(a => a.status === '출석').length;

    if (attendance.length === 0) {
      container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;">오늘 출석 기록이 없습니다</div>';
      return;
    }

    container.innerHTML = attendance.map(record => {
      const statusEmoji = record.status === '출석' ? '✓' : record.status === '결석' ? '✗' : '?';
      return `
        <div class="attendance-item">
          <div class="attendance-status">${statusEmoji}</div>
          <div class="attendance-name">${record.student}</div>
        </div>
      `;
    }).join('');
  }

  // 캘린더 로드
  async function loadCalendar() {
    const result = await fetchAPI('/calendar');
    const container = document.getElementById('calendar-grid');

    if (!result || !result.success) {
      container.innerHTML = '<div class="error" style="grid-column: 1/-1;">캘린더 데이터를 불러올 수 없습니다</div>';
      return;
    }

    const events = result.data || [];
    const today = new Date();
    const currentMonth = today.getMonth();
    const currentYear = today.getFullYear();

    // 월간 캘린더 생성
    const firstDay = new Date(currentYear, currentMonth, 1);
    const lastDay = new Date(currentYear, currentMonth + 1, 0);
    const daysInMonth = lastDay.getDate();
    const startingDayOfWeek = firstDay.getDay();

    document.getElementById('calendar-title').textContent =
      `📅 ${currentYear}년 ${currentMonth + 1}월`;

    let html = '';

    // 빈 셀
    for (let i = 0; i < startingDayOfWeek; i++) {
      html += '<div class="calendar-day" style="background: transparent; border: none;"></div>';
    }

    // 날짜
    for (let day = 1; day <= daysInMonth; day++) {
      const date = new Date(currentYear, currentMonth, day);
      const dateStr = date.toISOString().split('T')[0];
      const isToday = date.getDate() === today.getDate() &&
                     date.getMonth() === today.getMonth() &&
                     date.getFullYear() === today.getFullYear();
      const hasEvent = events.some(e => e.date === dateStr || e.date.startsWith(dateStr));

      const className = isToday ? 'today' : hasEvent ? 'event' : '';
      html += `<div class="calendar-day ${className}">${day}</div>`;
    }

    container.innerHTML = html;
    document.getElementById('stat-events').textContent = events.length;
  }

  // 탭 전환
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      btn.classList.add('active');
      const tabId = btn.dataset.tab;
      document.getElementById(tabId).classList.add('active');

      if (tabId === 'attendance') loadAttendance();
    });
  });

  // 초기 로드
  updateDate();
  loadStudents();
  loadAttendance();
  loadCalendar();

  // 5분마다 새로고침
  setInterval(() => {
    loadStudents();
    loadAttendance();
    loadCalendar();
  }, 5 * 60 * 1000);

  // PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>

</body>
</html>
