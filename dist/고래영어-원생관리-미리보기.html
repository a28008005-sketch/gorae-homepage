<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고래영어 원생관리 · 초전동캠퍼스</title>
<meta name="description" content="고래영어 학원 자체 원생관리 시스템 — 학생명부, 출결체크, 일일학습관리, 순회점검, 좌석배치, 통계, 학부모 공유">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐋</text></svg>">
<style>
/* ===== 고래영어 원생관리 · 스타일 ===== */
:root{
  --navy:#0d2c47;
  --navy-2:#123a5c;
  --blue:#1a7fd4;
  --blue-soft:#e8f2fc;
  --mint:#17b7a6;
  --mint-soft:#e2f7f4;
  --ink:#16232e;
  --muted:#63778a;
  --line:#e2e8ef;
  --bg:#f4f7fa;
  --card:#ffffff;
  --ok:#12a05c;
  --ok-soft:#e4f6ec;
  --warn:#d98218;
  --warn-soft:#fdf1e0;
  --bad:#d5453f;
  --bad-soft:#fdeceb;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,40,64,.05), 0 6px 20px rgba(16,40,64,.06);
  --sidebar-w:230px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ---------- Shell ---------- */
#app-shell{display:flex;min-height:100vh}

.sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
  background:linear-gradient(175deg,var(--navy),var(--navy-2));
  color:#dce8f2; display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}
.brand-mark{font-size:26px;line-height:1}
.brand-text{display:flex;flex-direction:column;line-height:1.25}
.brand-text b{color:#fff;font-size:16px;letter-spacing:-.2px}
.brand-text small{color:#8fb4d0;font-size:11.5px}

.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;flex:1;overflow-y:auto}
.nav a{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:9px;font-size:14px;color:#c6dbec;
  transition:background .13s,color .13s;
}
.nav a i{font-style:normal;font-size:15px;width:20px;text-align:center;opacity:.95}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.active{background:var(--blue);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(26,127,212,.35)}

.sidebar-foot{padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.09);font-size:11.5px;color:#89aac6}
.storage-note{margin-bottom:6px}
.ext-link{color:#8fc7f0}
.ext-link:hover{text-decoration:underline}

.main{flex:1;min-width:0;display:flex;flex-direction:column}

.topbar{
  display:flex;align-items:center;gap:14px;
  padding:16px 26px; background:#fff; border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.topbar-title{flex:1;min-width:0}
.topbar-title h1{margin:0;font-size:19px;letter-spacing:-.3px}
.topbar-title p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.today-chip{
  background:var(--blue-soft);color:#14588f;border-radius:999px;
  padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;
}
.icon-btn{
  border:1px solid var(--line);background:#fff;border-radius:9px;
  width:36px;height:36px;font-size:16px;cursor:pointer;color:var(--ink);
}
.only-mobile{display:none}

.content{padding:24px 26px 40px;flex:1}
.app-foot{padding:16px 26px 24px;color:#93a4b4;font-size:11.5px;border-top:1px solid var(--line);background:#fff}

.backdrop{display:none;position:fixed;inset:0;background:rgba(10,25,40,.45);z-index:25}
.backdrop.on{display:block}

/* ---------- Blocks ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:15px;letter-spacing:-.2px}
.card-h .sp{flex:1}
.card-b{padding:16px 18px}
.card-b.tight{padding:8px 10px}

.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-21{grid-template-columns:2fr 1fr}
.g-12{grid-template-columns:1fr 2fr}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}

/* stat tiles */
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .lbl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .val{font-size:27px;font-weight:700;letter-spacing:-.6px;margin-top:6px;line-height:1.15}
.stat .val small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.stat .sub{font-size:12px;color:var(--muted);margin-top:4px}
.stat.accent{background:linear-gradient(160deg,#155f9f,#1a7fd4);border-color:transparent;color:#fff}
.stat.accent .lbl,.stat.accent .sub{color:#cbe4f8}
.stat.accent .val small{color:#cbe4f8}

/* ---------- Controls ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;
  transition:background .12s,border-color .12s,transform .06s;
}
.btn:hover{background:#f7fafc}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1670bd}
.btn.mint{background:var(--mint);border-color:var(--mint);color:#fff}
.btn.mint:hover{background:#13a596}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#f0c4c2}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

input[type=text],input[type=tel],input[type=email],input[type=date],input[type=month],
input[type=datetime-local],input[type=search],input[type=number],select,textarea{
  border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13.5px;
  font-family:inherit;color:var(--ink);background:#fff;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdcf5;outline-offset:-1px;border-color:var(--blue)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-grid .full{grid-column:1/-1}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{
  border:0;background:#fff;padding:7px 13px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:600;
  border-right:1px solid var(--line);
}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--blue);color:#fff}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;
  font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;
}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on.blue{background:var(--blue);border-color:var(--blue)}
.chip.on.mint{background:var(--mint);border-color:var(--mint)}
.chip.on.warn{background:var(--warn);border-color:var(--warn)}
.chip.on.bad{background:var(--bad);border-color:var(--bad)}
.chip.static{cursor:default}

.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:#0d7a45}
.tag.bad{background:var(--bad-soft);color:#b8332e}
.tag.warn{background:var(--warn-soft);color:#a2610f}
.tag.blue{background:var(--blue-soft);color:#14588f}
.tag.mint{background:var(--mint-soft);color:#0d8375}
.tag.gray{background:#eef2f6;color:#5f7183}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
table.tbl th{
  text-align:left;font-size:12px;color:var(--muted);font-weight:700;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafcfd;
}
table.tbl td{padding:10px 12px;border-bottom:1px solid #eef2f6;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:#f8fbfd}
table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl .nm{font-weight:700}
.clickable{cursor:pointer}

.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px}
.empty .big{font-size:30px;display:block;margin-bottom:8px}

/* ---------- Attendance rows ---------- */
.att-row{
  display:grid;grid-template-columns:150px 128px 1fr;gap:12px;align-items:center;
  padding:11px 12px;border-bottom:1px solid #eef2f6;
}
.att-row:last-child{border-bottom:0}
.att-who{display:flex;align-items:center;gap:9px;min-width:0}
.klass-dot{
  width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block;
  margin-right:5px;vertical-align:middle;
}
.att-who .klass-dot{margin-right:0}
.att-who .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-who .gr{font-size:11.5px;color:var(--muted)}
.att-checks{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mini-note{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;width:100%}

.check{
  display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;
  border-radius:8px;padding:5px 9px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--muted);
}
.check.on{background:var(--mint-soft);border-color:#a9e5dd;color:#0d8375}
.check input{display:none}

/* ---------- Timetable ---------- */
.tt{display:grid;grid-template-columns:70px repeat(5,1fr);gap:8px}
.tt .hd{font-size:12px;color:var(--muted);font-weight:700;text-align:center;padding:6px 0}
.tt .tm{font-size:12.5px;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center}
.tt .cell{border:1px solid var(--line);border-radius:11px;background:#fff;padding:8px;min-height:74px}
.tt .pill{
  background:var(--blue-soft);color:#14588f;border-radius:7px;padding:3px 7px;
  font-size:11.5px;font-weight:700;margin-bottom:4px;display:block;
}

/* ---------- Bars ---------- */
.bar-row{display:grid;grid-template-columns:96px 1fr 62px;gap:10px;align-items:center;padding:6px 0}
.bar-track{background:#eef2f6;border-radius:999px;height:9px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--mint))}
.bar-fill.low{background:linear-gradient(90deg,#e0894a,var(--bad))}
.bar-val{font-size:12.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.bar-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Memo / tasks ---------- */
.memo-item{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eef2f6;font-size:13.5px}
.memo-item:last-child{border-bottom:0}
.memo-item .txt{flex:1;min-width:0;word-break:break-word}
.memo-item.done .txt{text-decoration:line-through;color:#a8b6c2}
.memo-item .dt{font-size:11.5px;color:var(--muted);white-space:nowrap}
.cbx{width:17px;height:17px;accent-color:var(--blue);margin-top:2px;flex:0 0 auto;cursor:pointer}
.x-btn{border:0;background:transparent;color:#b8c4cf;cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.x-btn:hover{color:var(--bad)}

/* ---------- Modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-bg{position:absolute;inset:0;background:rgba(10,25,40,.5)}
.modal{
  position:relative;background:#fff;border-radius:16px;width:100%;max-width:620px;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(10,30,50,.28);
}
.modal.wide{max-width:860px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:16px}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:#fafcfd;border-radius:0 0 16px 16px}

/* ---------- Toast ---------- */
.toast-root{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;
  box-shadow:0 8px 24px rgba(10,30,50,.28);animation:pop .2s ease-out;
}
.toast.bad{background:var(--bad)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Detail panel ---------- */
.kv{display:grid;grid-template-columns:88px 1fr;gap:7px 12px;font-size:13.5px}
.kv dt{color:var(--muted);font-size:12.5px;font-weight:600}
.kv dd{margin:0}

.section-title{font-size:12.5px;font-weight:700;color:var(--muted);margin:16px 0 8px;letter-spacing:.02em}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6}
.hint code{background:#eef2f6;padding:1px 5px;border-radius:5px;font-size:12px}

/* ---------- Parent report ---------- */
.report{background:#fff;border-radius:16px;border:1px solid var(--line);overflow:hidden}
.report-hd{background:linear-gradient(160deg,#0d2c47,#1a7fd4);color:#fff;padding:22px 24px}
.report-hd .who{font-size:21px;font-weight:700;letter-spacing:-.3px}
.report-hd .sub{font-size:12.5px;color:#c9e3f8;margin-top:4px}
.report-bd{padding:20px 24px}
.report-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.report-stat{background:#f6f9fc;border-radius:11px;padding:12px;text-align:center}
.report-stat .v{font-size:20px;font-weight:700}
.report-stat .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.share-view{max-width:760px;margin:0 auto;padding:26px 16px 60px}
body.share-mode .sidebar,body.share-mode .topbar,body.share-mode .app-foot{display:none}
body.share-mode .content{padding:0}

/* ---------- Responsive ---------- */
@media(max-width:1080px){
  .g-4{grid-template-columns:repeat(2,1fr)}
  .g-3{grid-template-columns:repeat(2,1fr)}
  .g-21,.g-12{grid-template-columns:1fr}
}
@media(max-width:760px){
  .only-mobile{display:grid;place-items:center}
  .sidebar{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none}
  .content{padding:16px 14px 32px}
  .topbar{padding:12px 14px}
  .g-4,.g-3,.g-2,.form-grid{grid-template-columns:1fr}
  .att-row{grid-template-columns:1fr;gap:8px}
  .report-stats{grid-template-columns:repeat(2,1fr)}
  .tt{grid-template-columns:56px repeat(5,1fr);gap:5px;font-size:11px}
}

/* ---------- Print ---------- */
@media print{
  .sidebar,.topbar,.app-foot,.no-print{display:none !important}
  body{background:#fff}
  .content{padding:0}
  .card,.report{box-shadow:none;border-color:#ddd}
  .report-hd{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---------- 로그인 게이트 ---------- */
.gate{
  position:fixed;inset:0;z-index:80;
  background:linear-gradient(165deg,#0d2c47,#123a5c 55%,#1a5c96);
  display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;
}
.gate-card{
  background:#fff;border-radius:18px;padding:32px 30px;width:100%;max-width:400px;
  box-shadow:0 24px 60px rgba(5,20,35,.35);
}
.gate-brand{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:20px}
.gate-brand span{color:var(--muted);font-weight:500}
.gate-card h1{margin:0 0 6px;font-size:21px;letter-spacing:-.4px}
.gate-sub{margin:0 0 20px;font-size:13px;color:var(--muted);line-height:1.6}
.gate-msg{
  background:var(--blue-soft);color:#14588f;border-radius:9px;
  padding:9px 12px;font-size:12.5px;margin-bottom:16px;
}
.gate-err{
  background:var(--bad-soft);color:#b8332e;border-radius:9px;
  padding:9px 12px;font-size:12.5px;margin-top:12px;font-weight:600;
}

/* ---------- 동기화 상태 칩 ---------- */
.sync-chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
  color:var(--muted);transition:background .12s;
}
.sync-chip:hover{background:#f7fafc}
.sync-chip.ok{background:var(--ok-soft);border-color:#a9dcc0;color:#0d7a45}
.sync-chip.blue{background:var(--blue-soft);border-color:#b9d9f4;color:#14588f}
.sync-chip.warn{background:var(--warn-soft);border-color:#f0d5a8;color:#a2610f}
.sync-chip.bad{background:var(--bad-soft);border-color:#f0c4c2;color:#b8332e}
.sync-chip.gray{background:#eef2f6;border-color:var(--line);color:#5f7183}

.topbar-right{display:flex;align-items:center;gap:8px}
@media(max-width:760px){
  .today-chip{display:none}
  .gate-card{padding:26px 22px}
}

/* ---------- 반(클래스) ---------- */
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.class-card{
  border:1px solid var(--line);border-radius:13px;padding:14px 15px;background:#fff;
  border-left:4px solid var(--klass);display:flex;flex-direction:column;gap:10px;
}
.class-top{display:flex;align-items:flex-start;gap:10px}
.class-top>div{flex:1;min-width:0}
.class-name{font-weight:700;font-size:14.5px;letter-spacing:-.2px}
.class-meta{font-size:12px;color:var(--muted);margin-top:3px}
.class-note{font-size:12px;color:var(--muted);background:#f6f9fc;border-radius:8px;padding:7px 10px}
.class-members{display:flex;flex-wrap:wrap;gap:5px;min-height:24px}
.class-actions{display:flex;gap:7px;margin-top:auto;padding-top:2px}

.pill{
  background:var(--blue-soft);color:#14588f;border-radius:7px;padding:3px 8px;
  font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;border:0;
}
.pill:hover{background:#d5e8f9}

.swatch{
  width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
}
.swatch.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff}

/* 시간표 블록 */
.tt-block{
  display:block;width:100%;text-align:left;border:0;cursor:pointer;
  background:color-mix(in srgb, var(--klass) 12%, #fff);
  border-left:3px solid var(--klass);border-radius:8px;
  padding:6px 8px;margin-bottom:5px;font-family:inherit;
}
.tt-block:hover{background:color-mix(in srgb, var(--klass) 20%, #fff)}
.tt-block b{display:block;font-size:12px;color:var(--ink);letter-spacing:-.2px}
.tt-block span{display:block;font-size:11px;color:var(--muted);margin-top:1px}

/* 학생 배정 목록 */
.member-list{max-height:52vh;overflow-y:auto;border:1px solid var(--line);border-radius:11px}
.member-row{
  display:flex;align-items:center;gap:10px;padding:9px 13px;
  border-bottom:1px solid #eef2f6;cursor:pointer;font-size:13.5px;
}

<script>
/* ===== 공통 유틸 ===== */
var U = (function () {
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  /** Date -> 'YYYY-MM-DD' (로컬 기준) */
  function ymd(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  /** Date -> 'YYYY-MM' */
  function ym(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  }
  /** 'YYYY-MM-DD' -> Date (로컬 정오 기준, 타임존 밀림 방지) */
  function parseYmd(s) {
    var p = String(s || '').split('-');
    return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0);
  }
  /** 'YYYY-MM-DD' -> '월' 같은 한글 요일 */
  function dayOf(s) { return DAYS[parseYmd(s).getDay()]; }
  /** 'YYYY-MM-DD' -> '2026년 8월 28일 (금)' */
  function human(s) {
    var d = parseYmd(s);
    return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DAYS[d.getDay()] + ')';
  }
  /** 'YYYY-MM-DD' -> '8/28(금)' */
  function shortDate(s) {
    var d = parseYmd(s);
    return (d.getMonth() + 1) + '/' + d.getDate() + '(' + DAYS[d.getDay()] + ')';
  }
  /** ISO datetime -> 'HH:MM' */
  function hhmm(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  /** 지금을 <input type="datetime-local"> 값으로 */
  function nowLocalInput() {
    var d = new Date();
    return ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  /** 해당 달의 모든 날짜 문자열 배열 */
  function daysInMonth(monthStr) {
    var p = monthStr.split('-'), y = +p[0], m = +p[1];
    var last = new Date(y, m, 0).getDate(), out = [];
    for (var i = 1; i <= last; i++) out.push(y + '-' + pad(m) + '-' + pad(i));
    return out;
  }
  /** n일 전 날짜 문자열 */
  function daysAgo(n, from) {
    var d = from ? parseYmd(from) : new Date();
    d.setDate(d.getDate() - n);
    return ymd(d);
  }

  function uid(prefix) {
    return (prefix || 'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  }

  /** HTML 이스케이프 */
  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /** 퍼센트 (0나눗셈 안전) */
  function pct(num, den) {
    if (!den) return 0;
    return Math.round((num / den) * 1000) / 10;
  }

  /** 금액 -> '120,000원' */
  function won(n) {
    var v = Math.round(Number(n) || 0);
    return v.toLocaleString('ko-KR') + '원';
  }
  /** 금액 -> '120,000' (단위 없음) */
  function num(n) {
    return (Math.round(Number(n) || 0)).toLocaleString('ko-KR');
  }
  /** 'YYYY-MM' -> '2026년 9월' */
  function humanMonth(m) {
    var p = String(m || '').split('-');
    return p[0] + '년 ' + (+p[1]) + '월';
  }
  /** 두 날짜(YYYY-MM-DD) 사이의 일수 (b - a) */
  function dayDiff(a, b) {
    return Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
  }

  /** 한국 전화번호 하이픈 */
  function phone(v) {
    var s = String(v || '').replace(/[^0-9]/g, '');
    if (!s) return '';
    if (s.length === 11) return s.slice(0, 3) + '-' + s.slice(3, 7) + '-' + s.slice(7);
    if (s.length === 10) return s.slice(0, 3) + '-' + s.slice(3, 6) + '-' + s.slice(6);
    return v;
  }

  /** 이름 기준 한글 정렬 */
  function byName(a, b) { return String(a.name || '').localeCompare(String(b.name || ''), 'ko'); }

  /** UTF-8 안전 base64 (URL-safe) */
  function encodeData(obj) {
    var json = JSON.stringify(obj);
    var b64 = btoa(unescape(encodeURIComponent(json)));
    return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decodeData(str) {
    try {
      var b64 = String(str).replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      return JSON.parse(decodeURIComponent(escape(atob(b64))));
    } catch (e) { return null; }
  }

  /** 파일 다운로드 */
  function download(filename, text, mime) {
    var blob = new Blob(['﻿' + text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 500);
  }

  /** CSV 셀 이스케이프 */
  function csvCell(v) {
    var s = (v === null || v === undefined) ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCsv(rows) {
    return rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
  }

  /** 클립보드 복사 (구형 브라우저 폴백 포함) */
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); resolve(); }
      catch (e) { reject(e); }
      finally { document.body.removeChild(ta); }
    });
  }

  return {
    DAYS: DAYS, pad: pad, ymd: ymd, ym: ym, parseYmd: parseYmd, dayOf: dayOf,
    human: human, shortDate: shortDate, hhmm: hhmm, nowLocalInput: nowLocalInput,
    daysInMonth: daysInMonth, daysAgo: daysAgo, uid: uid, esc: esc, pct: pct,
    won: won, num: num, humanMonth: humanMonth, dayDiff: dayDiff,
    phone: phone, byName: byName, encodeData: encodeData, decodeData: decodeData,
    download: download, toCsv: toCsv, copy: copy
  };
})();

</script>
<script>
/* ===== 데이터 저장소 (localStorage) =====
 * 노션 [프리미엄] 고래영어 학생관리의 데이터 구조를 그대로 옮겼습니다.
 *  - 학생 명부      -> students
 *  - 일일 학습 관리  -> attendance (출결 + 플래너/계획실천/숙제)
 *  - 순회 점검 기록  -> 일일학습 안의 '수업 태도'로 합쳤습니다
 *  - 메모           -> memos
 *  - 업무 메모       -> tasks
 */
var Store = (function () {
  var KEY = 'gorae-academy-v1';

  var STATUS = ['등록생', '대기생', '휴원생', '퇴원생'];
  var GRADES = ['1학년', '2학년', '3학년', '4학년', '5학년', '6학년', '중1', '중2', '중3'];
  var FLAGS = ['지각', '외출', '조퇴'];
  // 수업 태도 (예전 '순회 점검 기록'을 일일학습 안으로 합쳤습니다)
  var ATTITUDES = ['🟢 집중', '💤 졸음', '🏃 이탈/부재', '📱 휴대폰 사용', '💬 잡담/소란'];
  var CLASS_COLORS = ['#1a7fd4', '#17b7a6', '#d98218', '#8a6ad4', '#d5453f', '#12a05c', '#c2557f', '#4a7a99'];
  var WEEKDAYS = ['월', '화', '수', '목', '금', '토'];
  var PAY_METHODS = ['계좌이체', '현금', '카드', '기타'];

  var DEFAULTS = {
    version: 1,
    academy: {
      name: '고래영어',
      campus: '초전동캠퍼스',
      address: '경남 진주시 초전동 1639-2',
      phone: '010-3803-8335',
      site: 'https://whalejinju.kr',
      seatCount: 20,
      times: ['1시', '2시', '3시', '4시', '5시', '6시', '7시', '8시'],
      defaultFee: 250000,
      billingDay: 10,
      bankName: '',
      bankAccount: '',
      bankHolder: ''
    },
    meta: {},
    classes: [],
    students: [],
    attendance: [],
    patrols: [],   // 예전 순회 점검 기록 — 일일학습으로 옮긴 뒤 사용하지 않습니다
    memos: [],
    tasks: [],
    payments: []
  };

  var data = null;
  var listeners = [];
  var changeListeners = [];

  /** 컬렉션 이름 <-> 동기화 종류(kind) 매핑 */
  var KINDS = {
    klass: 'classes', student: 'students', attendance: 'attendance',
    memo: 'memos', task: 'tasks', payment: 'payments'
  };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /** 주의가 필요한 태도인지 (집중 외 전부) */
  function isIssue(state) { return state !== ATTITUDES[0]; }

  /** 레코드에 수정 시각을 찍습니다. 동기화의 기준값입니다. */
  function stamp(rec) {
    rec.updatedAt = new Date().toISOString();
    return rec;
  }

  /** 변경된 레코드를 구독자(동기화 엔진)에게 알립니다. */
  function emitChange(kind, id) {
    changeListeners.forEach(function (fn) {
      try { fn(kind, id); } catch (e) { /* 구독자 오류가 저장을 막지 않도록 */ }
    });
  }
  function onRecordChange(fn) { changeListeners.push(fn); }

  /** 살아있는 레코드만 (소프트 삭제 제외) */
  function alive(list) {
    return list.filter(function (r) { return !r.deleted; });
  }

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { /* 시크릿 모드 등 */ }
    if (!raw) { data = clone(DEFAULTS); return data; }
    try {
      var parsed = JSON.parse(raw);
      data = clone(DEFAULTS);
      // 얕은 병합 + academy 는 키 단위 병합 (새 필드가 추가돼도 안전)
      Object.keys(DEFAULTS).forEach(function (k) {
        if (k === 'academy') return;
        if (parsed[k] !== undefined) data[k] = parsed[k];
      });
      if (parsed.academy) {
        Object.keys(parsed.academy).forEach(function (k) { data.academy[k] = parsed.academy[k]; });
      }
    } catch (e) {
      data = clone(DEFAULTS);
    }
    return data;
  }

  /**
   * @param {{kind:string,id:string}|Array|undefined} changed
   *        바뀐 레코드. 넘기면 동기화 대기열에 올라갑니다.
   */
  function save(changed) {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {
      if (window.UI) UI.toast('저장 공간이 부족합니다. 설정에서 백업 후 정리해 주세요.', true);
    }
    if (changed) {
      (Array.isArray(changed) ? changed : [changed]).forEach(function (c) {
        emitChange(c.kind, c.id);
      });
    }
    listeners.forEach(function (fn) { fn(); });
  }

  function onChange(fn) { listeners.push(fn); }
  function get() { if (!data) load(); return data; }

  /* ---------- 반 (클래스) ---------- */
  function classes() {
    return alive(get().classes).slice().sort(function (a, b) {
      var ta = get().academy.times.indexOf(a.time), tb = get().academy.times.indexOf(b.time);
      if (ta !== tb) return ta - tb;
      return String(a.name || '').localeCompare(String(b.name || ''), 'ko');
    });
  }
  function klass(id) {
    if (!id) return null;
    return alive(get().classes).filter(function (c) { return c.id === id; })[0] || null;
  }
  function saveClass(c) {
    var d = get(), rec = null;
    if (c.id) {
      for (var i = 0; i < d.classes.length; i++) {
        if (d.classes[i].id === c.id) { rec = Object.assign(d.classes[i], c); break; }
      }
    }
    if (!rec) {
      c.id = c.id || U.uid('cls');
      if (!c.color) c.color = CLASS_COLORS[d.classes.length % CLASS_COLORS.length];
      rec = c;
      d.classes.push(rec);
    }
    stamp(rec);
    save({ kind: 'klass', id: rec.id });
    return rec.id;
  }
  /** 반 삭제 — 소속 학생은 미배정으로 돌립니다 (학생 기록은 그대로) */
  function deleteClass(id) {
    var d = get(), changed = [];
    d.classes.forEach(function (c) {
      if (c.id === id && !c.deleted) {
        c.deleted = true; stamp(c);
        changed.push({ kind: 'klass', id: c.id });
      }
    });
    d.students.forEach(function (s) {
      if (s.classId === id) {
        s.classId = ''; stamp(s);
        changed.push({ kind: 'student', id: s.id });
      }
    });
    save(changed);
  }
  function studentsInClass(classId) {
    return students().filter(function (s) { return s.classId === classId; });
  }
  /**
   * 학생의 실제 수업 요일·시간.
   * 반에 속해 있으면 반의 시간표를, 아니면 학생 개인 설정을 씁니다.
   */
  function scheduleOf(s) {
    var c = s && s.classId ? klass(s.classId) : null;
    return {
      days: c ? (c.days || []) : (s && s.days ? s.days : []),
      time: c ? (c.time || '') : (s && s.time ? s.time : ''),
      className: c ? c.name : '',
      color: c ? c.color : '',
      classId: c ? c.id : ''
    };
  }

  /* ---------- 학생 ---------- */
  function students(opts) {
    opts = opts || {};
    var list = alive(get().students).filter(function (s) {
      return opts.includeArchived ? true : !s.archived;
    });
    if (opts.status) list = list.filter(function (s) { return s.status === opts.status; });
    if (opts.active) list = list.filter(function (s) { return s.status === '등록생'; });
    return list.slice().sort(U.byName);
  }
  function student(id) {
    return alive(get().students).filter(function (s) { return s.id === id; })[0] || null;
  }
  function saveStudent(s) {
    var d = get();
    var rec = null;
    if (s.id) {
      for (var i = 0; i < d.students.length; i++) {
        if (d.students[i].id === s.id) { rec = Object.assign(d.students[i], s); break; }
      }
    }
    if (!rec) {
      s.id = s.id || U.uid('stu');
      s.createdAt = s.createdAt || new Date().toISOString();
      rec = s;
      d.students.push(rec);
    }
    stamp(rec);
    save({ kind: 'student', id: rec.id });
    return rec.id;
  }
  /** 보관(퇴원 처리) — 기록은 남기고 명부에서만 감춥니다 */
  function archiveStudent(id, on) {
    var s = student(id);
    if (!s) return;
    s.archived = !!on;
    if (on && s.status !== '퇴원생') s.status = '퇴원생';
    s.seat = on ? '' : s.seat;
    stamp(s);
    save({ kind: 'student', id: s.id });
  }
  /**
   * 삭제 — 학생과 연결된 모든 기록에 삭제 표시를 합니다.
   * 완전히 지우지 않고 표시만 남기는 이유는, 다른 선생님 기기에도
   * '이 기록은 지워졌다'는 사실이 전달되어야 하기 때문입니다.
   */
  function deleteStudent(id) {
    var d = get();
    var changed = [];
    function kill(list, kind, match) {
      list.forEach(function (r) {
        if (r.deleted || !match(r)) return;
        r.deleted = true;
        stamp(r);
        changed.push({ kind: kind, id: r.id });
      });
    }
    kill(d.students, 'student', function (s) { return s.id === id; });
    kill(d.attendance, 'attendance', function (a) { return a.studentId === id; });
    kill(d.memos, 'memo', function (m) { return m.studentId === id; });
    kill(d.payments, 'payment', function (p) { return p.studentId === id; });
    save(changed);
  }
  /** 특정 요일에 수업이 있는 등록생 */
  function studentsOnDay(dayKo) {
    return students({ active: true }).filter(function (s) {
      return scheduleOf(s).days.indexOf(dayKo) >= 0;
    });
  }

  /* ---------- 출결 · 일일학습 ---------- */
  function attendanceOn(date) {
    return alive(get().attendance).filter(function (a) { return a.date === date; });
  }
  function attendanceFor(studentId, date) {
    return alive(get().attendance).filter(function (a) {
      return a.studentId === studentId && a.date === date;
    })[0] || null;
  }
  function attendanceRange(studentId, from, to) {
    return alive(get().attendance).filter(function (a) {
      return a.studentId === studentId && a.date >= from && a.date <= to;
    }).sort(function (x, y) { return x.date < y.date ? -1 : 1; });
  }
  /** 출결 기록 저장 (없으면 생성) */
  function setAttendance(studentId, date, patch) {
    var d = get();
    var rec = attendanceFor(studentId, date);
    if (!rec) {
      rec = {
        id: U.uid('att'), studentId: studentId, date: date,
        status: '', flags: [], planner: false, planDone: false, homework: false,
        attitude: [], attitudeNote: '', note: ''
      };
      d.attendance.push(rec);
    }
    Object.keys(patch).forEach(function (k) { rec[k] = patch[k]; });
    stamp(rec);
    save({ kind: 'attendance', id: rec.id });
    return rec;
  }
  /** 수업 태도 항목 켜고 끄기 */
  function toggleAttitude(studentId, date, state) {
    var rec = attendanceFor(studentId, date);
    var list = rec && rec.attitude ? rec.attitude.slice() : [];
    var i = list.indexOf(state);
    if (i >= 0) list.splice(i, 1); else list.push(state);
    return setAttendance(studentId, date, { attitude: list });
  }
  function toggleFlag(studentId, date, flag) {
    var rec = attendanceFor(studentId, date);
    var flags = rec && rec.flags ? rec.flags.slice() : [];
    var i = flags.indexOf(flag);
    if (i >= 0) flags.splice(i, 1); else flags.push(flag);
    return setAttendance(studentId, date, { flags: flags });
  }

  /* ---------- 홈페이지 주소 옮기기 ---------- */
  /** 예전에 쓰던 홈페이지 주소 — 새 도메인(whalejinju.kr)으로 한 번 옮겨줍니다. */
  var OLD_SITES = [
    'https://englishwhale.com', 'http://englishwhale.com',
    'https://www.englishwhale.com', 'http://www.englishwhale.com', 'englishwhale.com'
  ];

  /**
   * 이미 쓰고 계신 브라우저에는 예전 주소가 저장돼 있으므로,
   * 새 도메인으로 한 번만 갱신합니다.
   * 직접 다른 주소를 넣어 두신 경우에는 건드리지 않습니다.
   */
  function migrateSite() {
    var d = get();
    if (!d.meta) d.meta = {};
    if (d.meta.siteMovedToKr) return false;

    var cur = String(d.academy.site || '').trim().replace(/\/+$/, '');
    var moved = false;
    if (!cur || OLD_SITES.indexOf(cur) >= 0) {
      d.academy.site = DEFAULTS.academy.site;
      stamp(d.academy);
      moved = true;
    }
    d.meta.siteMovedToKr = true;
    save(moved ? { kind: 'academy', id: 'main' } : undefined);
    return moved;
  }

  /* ---------- 예전 순회 점검 기록 옮기기 ---------- */
  /** 예전 상태 이름 -> 지금 수업 태도 이름 */
  var ATTITUDE_ALIAS = { '🟢 학습중': '🟢 집중' };

  /**
   * 예전에 따로 쌓아 둔 순회 점검 기록을 그날의 일일학습 기록 안으로 합칩니다.
   * 한 번만 실행되며, 옮긴 뒤 원래 기록에는 삭제 표시를 합니다.
   */
  function migratePatrols() {
    var d = get();
    if (!d.meta) d.meta = {};
    if (d.meta.patrolsMerged) return 0;
    var list = (d.patrols || []).filter(function (p) { return !p.deleted; });
    if (!list.length) { d.meta.patrolsMerged = true; return 0; }

    var moved = 0;
    list.forEach(function (p) {
      var date = String(p.at || '').slice(0, 10);
      if (!date || !p.studentId) return;
      var rec = attendanceFor(p.studentId, date);
      var attitude = (rec && rec.attitude ? rec.attitude.slice() : []);
      (p.states || []).forEach(function (st) {
        var name = ATTITUDE_ALIAS[st] || st;
        if (attitude.indexOf(name) < 0) attitude.push(name);
      });
      // 다른 기기에서 이미 옮긴 내용을 또 붙이지 않도록 중복은 걸러냅니다.
      var notes = [];
      function addNote(t) {
        t = String(t || '').trim();
        if (t && notes.indexOf(t) < 0) notes.push(t);
      }
      if (rec && rec.attitudeNote) String(rec.attitudeNote).split(' / ').forEach(addNote);
      addNote(p.action);
      addNote(p.note);
      setAttendance(p.studentId, date, {
        attitude: attitude,
        attitudeNote: notes.join(' / ')
      });
      p.deleted = true;
      stamp(p);
      moved++;
    });
    d.meta.patrolsMerged = true;
    save();
    return moved;
  }

  /* ---------- 메모 ---------- */
  function memos(studentId) {
    var list = alive(get().memos).slice();
    if (studentId) list = list.filter(function (m) { return m.studentId === studentId; });
    return list.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }
  function addMemo(m) {
    m.id = m.id || U.uid('memo');
    m.date = m.date || U.ymd();
    stamp(m);
    get().memos.push(m);
    save({ kind: 'memo', id: m.id });
  }
  function deleteMemo(id) {
    return softDelete('memos', 'memo', id);
  }

  /* ---------- 업무 메모 ---------- */
  function tasks(bucket) {
    var list = alive(get().tasks).slice();
    if (bucket) list = list.filter(function (t) { return t.bucket === bucket; });
    return list;
  }
  function addTask(text, bucket) {
    var t = stamp({ id: U.uid('task'), text: text, bucket: bucket || 'today', done: false, at: new Date().toISOString() });
    get().tasks.push(t);
    save({ kind: 'task', id: t.id });
  }
  function updateTask(id, patch) {
    get().tasks.forEach(function (t) {
      if (t.id === id) { Object.assign(t, patch); stamp(t); }
    });
    save({ kind: 'task', id: id });
  }
  function deleteTask(id) {
    return softDelete('tasks', 'task', id);
  }

  /** 컬렉션에서 한 레코드에 삭제 표시 */
  function softDelete(collection, kind, id) {
    var list = get()[collection];
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) {
        list[i].deleted = true;
        stamp(list[i]);
        save({ kind: kind, id: id });
        return true;
      }
    }
    return false;
  }

  /* ---------- 수강료 납부 ---------- */
  /** 청구서 목록 (월 / 학생 / 상태로 필터) */
  function payments(opts) {
    opts = opts || {};
    var list = alive(get().payments).slice();
    if (opts.month) list = list.filter(function (p) { return p.month === opts.month; });
    if (opts.studentId) list = list.filter(function (p) { return p.studentId === opts.studentId; });
    return list.sort(function (a, b) { return a.month < b.month ? 1 : -1; });
  }
  function paymentFor(studentId, month) {
    return alive(get().payments).filter(function (p) {
      return p.studentId === studentId && p.month === month;
    })[0] || null;
  }

  /** 학생의 월 수강료 (개인 설정 > 학원 기본값) */
  function feeOf(s) {
    var v = (s && s.fee !== undefined && s.fee !== '') ? Number(s.fee) : Number(get().academy.defaultFee);
    return isNaN(v) ? 0 : v;
  }
  /** 청구서의 납부 기한 계산 */
  function dueDateFor(month, billingDay) {
    var p = month.split('-');
    var last = new Date(+p[0], +p[1], 0).getDate();
    var day = Math.min(Math.max(parseInt(billingDay, 10) || get().academy.billingDay || 10, 1), last);
    return month + '-' + U.pad(day);
  }

  /**
   * 청구서 상태 판정
   *  면제(청구액 0) / 완납 / 부분납부 / 연체 / 청구
   */
  function paymentStatus(p, today) {
    today = today || U.ymd();
    var amount = Number(p.amount) || 0;
    var paid = Number(p.paidAmount) || 0;
    if (amount <= 0) return { key: 'exempt', label: '면제', tag: 'gray', overdue: 0 };
    if (paid >= amount) return { key: 'paid', label: '완납', tag: 'ok', overdue: 0 };
    var overdue = p.dueDate && today > p.dueDate ? U.dayDiff(p.dueDate, today) : 0;
    if (paid > 0) {
      return {
        key: 'partial',
        label: overdue ? '부분납부 · ' + overdue + '일 경과' : '부분납부',
        tag: 'warn', overdue: overdue
      };
    }
    if (overdue) return { key: 'overdue', label: '미납 ' + overdue + '일', tag: 'bad', overdue: overdue };
    return { key: 'due', label: '청구', tag: 'blue', overdue: 0 };
  }

  function savePayment(p) {
    var d = get();
    var rec = null;
    if (p.id) {
      for (var i = 0; i < d.payments.length; i++) {
        if (d.payments[i].id === p.id) { rec = Object.assign(d.payments[i], p); break; }
      }
    }
    if (!rec) {
      p.id = p.id || U.uid('pay');
      p.createdAt = p.createdAt || new Date().toISOString();
      rec = p;
      d.payments.push(rec);
    }
    stamp(rec);
    save({ kind: 'payment', id: rec.id });
    return rec.id;
  }
  function deletePayment(id) {
    return softDelete('payments', 'payment', id);
  }

  /**
   * 해당 월 청구서 일괄 생성.
   * 이미 청구서가 있는 학생은 건드리지 않고, 등록생만 대상으로 합니다.
   * @return 새로 만든 청구서 수
   */
  function generateBills(month) {
    var made = 0;
    students({ active: true }).forEach(function (s) {
      if (paymentFor(s.id, month)) return;
      savePayment({
        studentId: s.id, month: month,
        amount: feeOf(s),
        paidAmount: 0, paidDate: '', method: '', note: '',
        dueDate: dueDateFor(month, s.billingDay)
      });
      made++;
    });
    return made;
  }

  /** 월 전체 수납 집계 */
  function paymentSummary(month) {
    var list = payments({ month: month });
    var billed = 0, collected = 0, counts = { paid: 0, partial: 0, overdue: 0, due: 0, exempt: 0 };
    list.forEach(function (p) {
      billed += Number(p.amount) || 0;
      collected += Number(p.paidAmount) || 0;
      counts[paymentStatus(p).key]++;
    });
    return {
      list: list, billed: billed, collected: collected,
      outstanding: Math.max(0, billed - collected),
      rate: U.pct(collected, billed), counts: counts,
      unpaidCount: counts.overdue + counts.partial + counts.due
    };
  }

  /** 한 학생의 납부 이력 요약 */
  function paymentHistory(studentId) {
    var list = payments({ studentId: studentId });
    var billed = 0, collected = 0, unpaidMonths = [];
    list.forEach(function (p) {
      billed += Number(p.amount) || 0;
      collected += Number(p.paidAmount) || 0;
      var st = paymentStatus(p);
      if (st.key === 'overdue' || st.key === 'partial') unpaidMonths.push(p.month);
    });
    return { list: list, billed: billed, collected: collected, outstanding: billed - collected, unpaidMonths: unpaidMonths };
  }

  /* ---------- 집계 ---------- */
  /** 한 학생의 기간 통계 (노션의 출석률 / 체크사항 수식과 동일한 의미) */
  function summarize(studentId, from, to) {
    var recs = attendanceRange(studentId, from, to);
    var present = 0, absent = 0, planner = 0, planDone = 0, homework = 0;
    var flagCount = { '지각': 0, '외출': 0, '조퇴': 0 };
    recs.forEach(function (r) {
      if (r.status === '출석') present++;
      else if (r.status === '결석') absent++;
      if (r.planner) planner++;
      if (r.planDone) planDone++;
      if (r.homework) homework++;
      (r.flags || []).forEach(function (f) { if (flagCount[f] !== undefined) flagCount[f]++; });
    });
    var marked = present + absent;
    // 수업 태도에 주의 항목(졸음 · 이탈 · 휴대폰 · 잡담)이 찍힌 날 수
    var issues = 0, attitudeCount = {};
    ATTITUDES.forEach(function (a) { attitudeCount[a] = 0; });
    recs.forEach(function (r) {
      var list = r.attitude || [];
      list.forEach(function (a) { if (attitudeCount[a] !== undefined) attitudeCount[a]++; });
      if (list.some(isIssue)) issues++;
    });
    return {
      records: recs, total: marked, present: present, absent: absent,
      rate: U.pct(present, marked),
      planner: planner, planDone: planDone, homework: homework,
      plannerRate: U.pct(planner, marked), homeworkRate: U.pct(homework, marked),
      flags: flagCount, attitude: attitudeCount, attitudeIssues: issues
    };
  }

  /** 특정 날짜의 학원 전체 현황 */
  function dayOverview(date) {
    var day = U.dayOf(date);
    var expected = studentsOnDay(day);
    var present = 0, absent = 0, late = 0, unmarked = 0;
    expected.forEach(function (s) {
      var r = attendanceFor(s.id, date);
      if (!r || !r.status) { unmarked++; return; }
      if (r.status === '출석') present++;
      if (r.status === '결석') absent++;
      if ((r.flags || []).indexOf('지각') >= 0) late++;
    });
    return {
      date: date, day: day, expected: expected,
      present: present, absent: absent, late: late, unmarked: unmarked,
      rate: U.pct(present, present + absent)
    };
  }

  /* ---------- 동기화 지원 ---------- */
  /** 모든 레코드를 {kind, id, data, updatedAt, deleted} 형태로 펼칩니다. */
  function allRecords() {
    var d = get(), out = [];
    Object.keys(KINDS).forEach(function (kind) {
      (d[KINDS[kind]] || []).forEach(function (r) {
        out.push({
          kind: kind, id: r.id, data: r,
          updatedAt: r.updatedAt || '1970-01-01T00:00:00.000Z',
          deleted: !!r.deleted
        });
      });
    });
    out.push({
      kind: 'academy', id: 'main', data: d.academy,
      updatedAt: d.academy.updatedAt || '1970-01-01T00:00:00.000Z',
      deleted: false
    });
    return out;
  }

  /** 한 레코드를 kind+id 로 찾습니다. */
  function findRecord(kind, id) {
    var d = get();
    if (kind === 'academy') return d.academy;
    var list = d[KINDS[kind]];
    if (!list) return null;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  /**
   * 서버에서 받은 레코드를 병합합니다.
   * 같은 레코드가 양쪽에서 바뀐 경우 updatedAt 이 나중인 쪽을 남깁니다.
   * @return 실제로 반영된 건수
   */
  function applyRemote(rows) {
    var d = get(), n = 0;
    (rows || []).forEach(function (row) {
      if (!row || !row.kind) return;
      var incoming = row.data || {};
      incoming.updatedAt = row.updatedAt || incoming.updatedAt;
      if (row.deleted) incoming.deleted = true;

      if (row.kind === 'academy') {
        if (!d.academy.updatedAt || d.academy.updatedAt < incoming.updatedAt) {
          d.academy = incoming; n++;
        }
        return;
      }
      var list = d[KINDS[row.kind]];
      if (!list) return;
      var local = findRecord(row.kind, row.id);
      if (!local) {
        incoming.id = row.id;
        list.push(incoming); n++;
      } else if (!local.updatedAt || local.updatedAt < incoming.updatedAt) {
        // 제자리 교체 — 다른 참조가 깨지지 않도록 키를 덮어씁니다.
        Object.keys(local).forEach(function (k) { delete local[k]; });
        Object.assign(local, incoming, { id: row.id });
        n++;
      }
    });
    if (n) save();
    return n;
  }

  /** 모든 레코드에 새 수정 시각을 찍습니다 (백업 복원 · 최초 업로드용) */
  function stampAll() {
    var recs = allRecords();
    var now = new Date().toISOString();
    recs.forEach(function (r) { r.data.updatedAt = now; r.updatedAt = now; });
    save();
    return recs.map(function (r) { return { kind: r.kind, id: r.id }; });
  }

  /* ---------- 백업 / 복원 ---------- */
  function exportJson() { return JSON.stringify(get(), null, 2); }
  function importJson(text) {
    var parsed = JSON.parse(text);
    if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.students)) {
      throw new Error('고래영어 원생관리 백업 파일이 아닙니다.');
    }
    localStorage.setItem(KEY, JSON.stringify(parsed));
    load();
    // 복원한 기록이 클라우드로도 올라가도록 전부 새 시각을 찍습니다.
    save(stampAll());
  }
  function resetAll() {
    // 삭제 표시를 남겨야 다른 기기에도 초기화가 전달됩니다.
    var changed = [];
    var d = get();
    Object.keys(KINDS).forEach(function (kind) {
      (d[KINDS[kind]] || []).forEach(function (r) {
        if (r.deleted) return;
        r.deleted = true; stamp(r);
        changed.push({ kind: kind, id: r.id });
      });
    });
    save(changed);
    data = clone(DEFAULTS);
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
    listeners.forEach(function (fn) { fn(); });
  }
  function saveAcademy(patch) {
    Object.assign(get().academy, patch);
    stamp(get().academy);
    save({ kind: 'academy', id: 'main' });
  }

  load();
  migratePatrols();
  migrateSite();

  return {
    STATUS: STATUS, GRADES: GRADES, FLAGS: FLAGS,
    ATTITUDES: ATTITUDES, WEEKDAYS: WEEKDAYS, PAY_METHODS: PAY_METHODS,
    CLASS_COLORS: CLASS_COLORS,
    get: get, save: save, onChange: onChange, onRecordChange: onRecordChange,
    allRecords: allRecords, findRecord: findRecord, applyRemote: applyRemote, stampAll: stampAll,
    students: students, student: student, saveStudent: saveStudent,
    archiveStudent: archiveStudent, deleteStudent: deleteStudent,
    studentsOnDay: studentsOnDay,
    attendanceOn: attendanceOn, attendanceFor: attendanceFor, attendanceRange: attendanceRange,
    setAttendance: setAttendance, toggleFlag: toggleFlag,
    isIssue: isIssue, toggleAttitude: toggleAttitude,
    classes: classes, klass: klass, saveClass: saveClass, deleteClass: deleteClass,
    studentsInClass: studentsInClass, scheduleOf: scheduleOf,
    memos: memos, addMemo: addMemo, deleteMemo: deleteMemo,
    tasks: tasks, addTask: addTask, updateTask: updateTask, deleteTask: deleteTask,
    payments: payments, paymentFor: paymentFor, feeOf: feeOf, dueDateFor: dueDateFor,
    paymentStatus: paymentStatus, savePayment: savePayment, deletePayment: deletePayment,
    generateBills: generateBills, paymentSummary: paymentSummary, paymentHistory: paymentHistory,
    summarize: summarize, dayOverview: dayOverview,
    exportJson: exportJson, importJson: importJson, resetAll: resetAll, saveAcademy: saveAcademy,
    migratePatrols: migratePatrols, migrateSite: migrateSite
  };
})();

</script>
<script>
/* ===== 공통 UI 헬퍼 (토스트 · 모달 · 반복 렌더) ===== */
var UI = (function () {

  /* ---------- 토스트 ---------- */
  function toast(msg, isBad) {
    var root = document.getElementById('toast-root');
    var el = document.createElement('div');
    el.className = 'toast' + (isBad ? ' bad' : '');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function () {
      el.style.transition = 'opacity .25s';
      el.style.opacity = '0';
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 260);
    }, 2200);
  }

  /* ---------- 모달 ---------- */
  var openModal = null;

  function modal(opts) {
    close();
    var wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML =
      '<div class="modal-bg"></div>' +
      '<div class="modal' + (opts.wide ? ' wide' : '') + '">' +
        '<div class="modal-h"><h3>' + U.esc(opts.title || '') + '</h3><div class="sp"></div>' +
          '<button class="x-btn" data-close style="font-size:20px">&times;</button></div>' +
        '<div class="modal-b">' + (opts.body || '') + '</div>' +
        (opts.footer === false ? '' : '<div class="modal-f">' + (opts.footer || '<button class="btn" data-close>닫기</button>') + '</div>') +
      '</div>';
    document.getElementById('modal-root').appendChild(wrap);
    openModal = wrap;

    wrap.querySelector('.modal-bg').addEventListener('click', close);
    wrap.querySelectorAll('[data-close]').forEach(function (b) {
      b.addEventListener('click', close);
    });
    if (opts.onMount) opts.onMount(wrap);
    return wrap;
  }

  function close() {
    if (openModal && openModal.parentNode) openModal.parentNode.removeChild(openModal);
    openModal = null;
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') close();
  });

  /** 확인 대화상자 */
  function confirm(msg, onYes, opts) {
    opts = opts || {};
    modal({
      title: opts.title || '확인',
      body: '<p style="margin:0;font-size:14px;line-height:1.7">' + msg + '</p>',
      footer: '<button class="btn" data-close>취소</button>' +
              '<button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" id="confirm-yes">' +
              U.esc(opts.yes || '확인') + '</button>',
      onMount: function (w) {
        w.querySelector('#confirm-yes').addEventListener('click', function () {
          close(); onYes();
        });
      }
    });
  }

  /* ---------- 렌더 헬퍼 ---------- */
  function statusTag(status) {
    var map = { '등록생': 'ok', '대기생': 'blue', '휴원생': 'gray', '퇴원생': 'gray' };
    return '<span class="tag ' + (map[status] || 'gray') + '">' + U.esc(status || '-') + '</span>';
  }

  function attTag(rec) {
    if (!rec || !rec.status) return '<span class="tag gray">미체크</span>';
    if (rec.status === '결석') return '<span class="tag bad">결석</span>';
    var flags = rec.flags || [];
    if (flags.length) return '<span class="tag warn">출석 · ' + U.esc(flags.join('/')) + '</span>';
    return '<span class="tag ok">출석</span>';
  }

  function emptyBox(msg, icon) {
    return '<div class="empty"><span class="big">' + (icon || '🐋') + '</span>' + U.esc(msg) + '</div>';
  }

  function bar(name, value, max, suffix) {
    var w = max ? Math.min(100, (value / max) * 100) : 0;
    return '<div class="bar-row">' +
      '<div class="bar-name">' + U.esc(name) + '</div>' +
      '<div class="bar-track"><div class="bar-fill' + (w < 60 ? ' low' : '') + '" style="width:' + w + '%"></div></div>' +
      '<div class="bar-val">' + value + (suffix || '') + '</div></div>';
  }

  /** select 옵션 문자열 */
  function options(list, selected, placeholder) {
    var out = placeholder ? '<option value="">' + U.esc(placeholder) + '</option>' : '';
    list.forEach(function (v) {
      var val = (typeof v === 'object') ? v.value : v;
      var lab = (typeof v === 'object') ? v.label : v;
      out += '<option value="' + U.esc(val) + '"' + (String(selected) === String(val) ? ' selected' : '') + '>' + U.esc(lab) + '</option>';
    });
    return out;
  }

  /** 이벤트 위임 */
  function on(root, selector, type, handler) {
    root.addEventListener(type, function (e) {
      var el = e.target.closest(selector);
      if (el && root.contains(el)) handler(e, el);
    });
  }

  return {
    toast: toast, modal: modal, close: close, confirm: confirm,
    statusTag: statusTag, attTag: attTag, emptyBox: emptyBox, bar: bar,
    options: options, on: on
  };
})();

</script>
<script>
/* ===== 클라우드 연결 (Supabase) =====
 * 여러 선생님이 각자 기기에서 같은 기록을 보도록 하는 저장소입니다.
 * 화면 코드는 이 파일을 직접 부르지 않습니다. 동기화(sync.js)만 사용합니다.
 *
 * 전송 계층(transport)은 갈아끼울 수 있게 분리해 두었습니다.
 * 실제 서비스에서는 Supabase 를 쓰고, 테스트에서는 가짜 전송 계층을 넣습니다.
 */
var Cloud = (function () {

  var transport = null;
  var CDN = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';

  /** 테스트·대체 구현용 */
  function setTransport(t) { transport = t; }
  function getTransport() { return transport; }

  /* ---------- Supabase 전송 계층 ---------- */
  function loadSdk() {
    if (window.supabase && window.supabase.createClient) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var existing = document.querySelector('script[data-supabase-sdk]');
      if (existing) {
        existing.addEventListener('load', function () { resolve(); });
        existing.addEventListener('error', function () { reject(new Error('SDK 로드 실패')); });
        return;
      }
      var el = document.createElement('script');
      el.src = CDN;
      el.setAttribute('data-supabase-sdk', '1');
      el.onload = function () { resolve(); };
      el.onerror = function () {
        reject(new Error('Supabase 연결 파일을 내려받지 못했습니다. 인터넷 연결을 확인해 주세요.'));
      };
      document.head.appendChild(el);
    });
  }

  /**
   * @param {string} url      Supabase 프로젝트 URL
   * @param {string} anonKey  공개(anon) 키 — 브라우저에 노출되어도 되는 키입니다.
   *                          service_role 키는 절대 여기에 넣으면 안 됩니다.
   */
  function supabaseTransport(url, anonKey) {
    var client = null;
    var TABLE = 'records';

    function need() {
      if (!client) throw new Error('클라우드에 아직 연결되지 않았습니다.');
      return client;
    }

    return {
      name: 'supabase',

      connect: function () {
        return loadSdk().then(function () {
          client = window.supabase.createClient(url, anonKey, {
            auth: { persistSession: true, autoRefreshToken: true }
          });
          return client.auth.getSession().then(function (res) {
            return (res.data && res.data.session) ? res.data.session.user : null;
          });
        });
      },

      signIn: function (email, password) {
        return need().auth.signInWithPassword({ email: email, password: password })
          .then(function (res) {
            if (res.error) throw new Error(translateAuthError(res.error.message));
            return res.data.user;
          });
      },

      signOut: function () {
        return need().auth.signOut();
      },

      /** since 이후에 바뀐 레코드만 받아옵니다. */
      fetchSince: function (since) {
        var q = need().from(TABLE).select('kind,id,data,updated_at,deleted');
        // gte 로 겹쳐 받습니다. 같은 밀리초에 쓰인 레코드를 놓치지 않기 위해서이고,
        // 병합은 멱등이라 중복으로 받아도 문제가 없습니다.
        if (since) q = q.gte('updated_at', since);
        return q.then(function (res) {
          if (res.error) throw new Error(res.error.message);
          return (res.data || []).map(function (r) {
            return { kind: r.kind, id: r.id, data: r.data, updatedAt: r.updated_at, deleted: !!r.deleted };
          });
        });
      },

      upsert: function (rows) {
        if (!rows.length) return Promise.resolve();
        // updated_at 은 서버 트리거가 찍습니다. 선생님들 기기의 시계가
        // 서로 조금씩 다르더라도 순서가 뒤집히지 않도록 하기 위해서입니다.
        var payload = rows.map(function (r) {
          return { kind: r.kind, id: r.id, data: r.data, deleted: !!r.deleted };
        });
        return need().from(TABLE).upsert(payload, { onConflict: 'kind,id' })
          .then(function (res) {
            if (res.error) throw new Error(res.error.message);
          });
      }
    };
  }

  /** Supabase 인증 오류를 학원에서 알아볼 수 있는 말로 바꿉니다. */
  function translateAuthError(msg) {
    var m = String(msg || '');
    if (/Invalid login credentials/i.test(m)) return '이메일 또는 비밀번호가 맞지 않습니다.';
    if (/Email not confirmed/i.test(m)) return '이메일 인증이 아직 끝나지 않은 계정입니다.';
    if (/rate limit|too many/i.test(m)) return '로그인 시도가 너무 잦습니다. 잠시 후 다시 시도해 주세요.';
    return m;
  }

  return {
    setTransport: setTransport,
    getTransport: getTransport,
    supabaseTransport: supabaseTransport,
    translateAuthError: translateAuthError
  };
})();

</script>
<script>
/* ===== 동기화 엔진 =====
 * 화면과 저장소는 지금까지처럼 동기(즉시)로 동작하고,
 * 이 파일이 뒤에서 조용히 클라우드와 주고받습니다.
 *
 *  - 내가 고친 기록  : 대기열에 담아 잠시 뒤 한 번에 올림 (offline 이면 쌓아둠)
 *  - 남이 고친 기록  : 주기적으로 내려받아 병합하고 화면을 새로 그림
 *  - 충돌           : 나중에 저장된 쪽이 남음 (서버 시각 기준)
 */
var Sync = (function () {

  var CFG_KEY = 'gorae-academy-sync';
  var PULL_MS = 15000;
  var PUSH_DEBOUNCE_MS = 800;

  var cfg = { mode: 'local', url: '', anonKey: '', lastPulledAt: '', pending: [] };
  var transport = null;
  var user = null;
  var status = 'off';        // off | connecting | online | offline | error | signedout
  var statusMsg = '';
  var statusListeners = [];
  var pushTimer = null;
  var pullTimer = null;
  var busy = false;

  /* ---------- 설정 저장 ---------- */
  function loadCfg() {
    try {
      var raw = localStorage.getItem(CFG_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        Object.keys(cfg).forEach(function (k) { if (p[k] !== undefined) cfg[k] = p[k]; });
      }
    } catch (e) { /* 저장소를 못 읽으면 로컬 모드로 둡니다 */ }
    if (!Array.isArray(cfg.pending)) cfg.pending = [];
    return cfg;
  }
  function saveCfg() {
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
  }

  /** 인증이 끊긴 오류인지 (토큰 만료 · 권한 없음) */
  function isAuthError(err) {
    var m = String((err && err.message) || err || '');
    return /JWT|jwt|401|Unauthorized|not authenticated|session|로그인/i.test(m);
  }

  function setStatus(s, msg) {
    status = s;
    statusMsg = msg || '';
    statusListeners.forEach(function (fn) { try { fn(s, statusMsg); } catch (e) {} });
  }
  function onStatus(fn) { statusListeners.push(fn); fn(status, statusMsg); }

  function isCloud() { return cfg.mode === 'cloud'; }
  function signedIn() { return !!user; }
  function currentUser() { return user; }
  function pendingCount() { return cfg.pending.length; }
  function config() { return { mode: cfg.mode, url: cfg.url, anonKey: cfg.anonKey, lastPulledAt: cfg.lastPulledAt }; }

  /* ---------- 대기열 ---------- */
  function enqueue(kind, id) {
    var key = kind + ':' + id;
    if (cfg.pending.indexOf(key) < 0) cfg.pending.push(key);
    saveCfg();
    schedulePush();
  }
  function schedulePush() {
    if (!isCloud() || !signedIn()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () { push(); }, PUSH_DEBOUNCE_MS);
  }

  /** 대기열의 레코드를 현재 값으로 만들어 올립니다. */
  function push() {
    if (!isCloud() || !signedIn() || busy || !cfg.pending.length) return Promise.resolve(0);
    var batch = cfg.pending.slice();
    var rows = [];
    batch.forEach(function (key) {
      var i = key.indexOf(':');
      var kind = key.slice(0, i), id = key.slice(i + 1);
      var rec = Store.findRecord(kind, id);
      if (!rec) return;
      rows.push({ kind: kind, id: id, data: rec, deleted: !!rec.deleted });
    });
    if (!rows.length) {
      cfg.pending = []; saveCfg();
      return Promise.resolve(0);
    }

    busy = true;
    setStatus('connecting');
    return transport.upsert(rows).then(function () {
      // 올리는 동안 새로 쌓인 항목은 남겨둡니다.
      cfg.pending = cfg.pending.filter(function (k) { return batch.indexOf(k) < 0; });
      saveCfg();
      setStatus('online');
      return rows.length;
    }).catch(function (err) {
      if (isAuthError(err)) { user = null; stopLoop(); setStatus('signedout', '다시 로그인해 주세요.'); }
      else setStatus('offline', err.message || '전송 실패');
      return 0;
    }).then(function (n) {
      busy = false;
      return n;
    });
  }

  /** 서버에서 바뀐 기록을 받아 병합합니다. */
  function pull() {
    if (!isCloud() || !signedIn() || busy) return Promise.resolve(0);
    busy = true;
    return transport.fetchSince(cfg.lastPulledAt || null).then(function (rows) {
      var newest = cfg.lastPulledAt || '';
      rows.forEach(function (r) { if (r.updatedAt && r.updatedAt > newest) newest = r.updatedAt; });
      var applied = Store.applyRemote(rows);
      cfg.lastPulledAt = newest;
      saveCfg();
      setStatus('online');
      if (applied && window.App && App.rerender) App.rerender();
      return applied;
    }).catch(function (err) {
      if (isAuthError(err)) { user = null; stopLoop(); setStatus('signedout', '다시 로그인해 주세요.'); }
      else setStatus('offline', err.message || '연결 실패');
      return 0;
    }).then(function (n) {
      busy = false;
      return n;
    });
  }

  /** 올리고 내려받기를 한 번에 */
  function syncNow() {
    return push().then(function () { return pull(); });
  }

  function startLoop() {
    clearInterval(pullTimer);
    pullTimer = setInterval(function () {
      if (document.hidden) return;
      syncNow();
    }, PULL_MS);
  }
  function stopLoop() { clearInterval(pullTimer); }

  /* ---------- 연결 · 로그인 ---------- */
  function makeTransport() {
    // 테스트나 다른 백엔드를 위해 미리 심어둔 전송 계층이 있으면 그것을 씁니다.
    var injected = Cloud.getTransport();
    if (injected) return injected;
    return Cloud.supabaseTransport(cfg.url, cfg.anonKey);
  }

  /** 앱 시작 시 호출. 저장된 설정으로 연결을 복구합니다. */
  function init() {
    loadCfg();
    Store.onRecordChange(function (kind, id) {
      if (isCloud()) enqueue(kind, id);
    });
    if (!isCloud()) { setStatus('off'); return Promise.resolve(null); }

    setStatus('connecting');
    transport = makeTransport();
    return transport.connect().then(function (u) {
      user = u || null;
      if (!user) { setStatus('signedout'); return null; }
      setStatus('online');
      startLoop();
      window.addEventListener('focus', function () { syncNow(); });
      return syncNow().then(function () { return user; });
    }).catch(function (err) {
      setStatus('error', err.message || '연결 실패');
      return null;
    });
  }

  function signIn(email, password) {
    if (!transport) transport = makeTransport();
    return Promise.resolve()
      .then(function () { return transport.connect ? transport.connect() : null; })
      .then(function () { return transport.signIn(email, password); })
      .then(function (u) {
        user = u;
        setStatus('online');
        startLoop();
        return syncNow().then(function () { return u; });
      });
  }

  function signOut() {
    stopLoop();
    return Promise.resolve(transport && transport.signOut())
      .catch(function () {})
      .then(function () {
        user = null;
        setStatus('signedout');
      });
  }

  /* ---------- 모드 전환 ---------- */
  /**
   * 클라우드 모드로 전환합니다. 로그인은 별도로 해야 합니다.
   */
  function enableCloud(url, anonKey) {
    cfg.mode = 'cloud';
    cfg.url = String(url || '').trim().replace(/\/+$/, '');
    cfg.anonKey = String(anonKey || '').trim();
    cfg.lastPulledAt = '';
    saveCfg();
    transport = makeTransport();
    setStatus('connecting');
    return transport.connect().then(function (u) {
      user = u || null;
      setStatus(user ? 'online' : 'signedout');
      return user;
    });
  }

  function disableCloud() {
    stopLoop();
    cfg.mode = 'local';
    cfg.pending = [];
    cfg.lastPulledAt = '';
    saveCfg();
    user = null;
    transport = null;
    setStatus('off');
  }

  /**
   * 이 기기에 있는 기록 전체를 클라우드로 올립니다.
   * 백업 파일을 불러온 직후나, 처음 클라우드로 옮길 때 사용합니다.
   */
  function uploadAll() {
    if (!isCloud() || !signedIn()) {
      return Promise.reject(new Error('먼저 클라우드에 로그인해 주세요.'));
    }
    var changed = Store.stampAll();
    changed.forEach(function (c) {
      var key = c.kind + ':' + c.id;
      if (cfg.pending.indexOf(key) < 0) cfg.pending.push(key);
    });
    saveCfg();
    // 큰 묶음은 나눠서 올립니다.
    return (function flush() {
      if (!cfg.pending.length) return Promise.resolve();
      return push().then(function (n) { return n ? flush() : Promise.resolve(); });
    })().then(function () { return changed.length; });
  }

  return {
    init: init, isCloud: isCloud, signedIn: signedIn, currentUser: currentUser,
    signIn: signIn, signOut: signOut, enableCloud: enableCloud, disableCloud: disableCloud,
    uploadAll: uploadAll, syncNow: syncNow, push: push, pull: pull,
    onStatus: onStatus, status: function () { return status; }, statusMessage: function () { return statusMsg; },
    pendingCount: pendingCount, config: config
  };
})();

</script>
<script>
/* ===== 로그인 화면 · 동기화 상태 표시 ===== */
var AuthUI = (function () {

  var gateEl = null;

  /* ---------- 로그인 게이트 ---------- */
  function needsLogin() {
    return Sync.isCloud() && !Sync.signedIn();
  }

  function showGate(message) {
    if (gateEl) { gateEl.remove(); gateEl = null; }
    var ac = Store.get().academy;
    gateEl = document.createElement('div');
    gateEl.className = 'gate';
    gateEl.innerHTML =
      '<div class="gate-card">' +
        '<div class="gate-brand">🐋 ' + U.esc(ac.name) + ' <span>' + U.esc(ac.campus || '') + '</span></div>' +
        '<h1>선생님 로그인</h1>' +
        '<p class="gate-sub">학원 계정으로 로그인하면 다른 선생님이 입력한 기록까지 함께 보입니다.</p>' +
        (message ? '<div class="gate-msg">' + U.esc(message) + '</div>' : '') +
        '<label class="fld">이메일<input type="email" id="g-email" autocomplete="username" placeholder="teacher@example.com"></label>' +
        '<label class="fld" style="margin-top:12px">비밀번호<input type="password" id="g-pw" autocomplete="current-password"></label>' +
        '<div class="gate-err" id="g-err" hidden></div>' +
        '<button class="btn primary block" id="g-login" style="margin-top:16px">로그인</button>' +
        '<button class="btn block ghost" id="g-local" style="margin-top:8px">이 기기에만 저장하는 모드로 쓰기</button>' +
        '<p class="hint" style="margin-top:16px;text-align:center">계정은 원장님이 만들어 드립니다.<br>비밀번호를 잊으셨다면 원장님께 재설정을 요청해 주세요.</p>' +
      '</div>';
    document.body.appendChild(gateEl);

    var err = gateEl.querySelector('#g-err');
    function fail(msg) {
      err.textContent = msg;
      err.hidden = false;
    }

    function doLogin() {
      var email = gateEl.querySelector('#g-email').value.trim();
      var pw = gateEl.querySelector('#g-pw').value;
      if (!email || !pw) { fail('이메일과 비밀번호를 모두 입력해 주세요.'); return; }
      var btn = gateEl.querySelector('#g-login');
      btn.disabled = true; btn.textContent = '로그인 중…';
      err.hidden = true;
      Sync.signIn(email, pw).then(function () {
        hideGate();
        UI.toast('로그인했습니다.');
        if (window.App) App.rerender();
      }).catch(function (e) {
        fail(e && e.message ? e.message : '로그인에 실패했습니다.');
        btn.disabled = false; btn.textContent = '로그인';
      });
    }

    gateEl.querySelector('#g-login').addEventListener('click', doLogin);
    gateEl.querySelector('#g-pw').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });
    gateEl.querySelector('#g-local').addEventListener('click', function () {
      UI.confirm(
        '이 기기에만 저장하는 모드로 바꿀까요?<br>' +
        '<span style="font-size:13px;color:#63778a">클라우드 연결이 끊기고, 이 기기에 남아 있는 기록만 보입니다. ' +
        '설정 화면에서 언제든 다시 연결할 수 있습니다.</span>',
        function () {
          Sync.disableCloud();
          hideGate();
          if (window.App) App.rerender();
          UI.toast('이 기기 저장 모드로 전환했습니다.');
        }, { yes: '전환' });
    });

    setTimeout(function () {
      var f = gateEl.querySelector('#g-email');
      if (f) f.focus();
    }, 50);
  }

  function hideGate() {
    if (gateEl) { gateEl.remove(); gateEl = null; }
  }

  /** 로그인이 필요하면 화면을 덮고, 아니면 걷어냅니다. */
  function gate(message) {
    if (needsLogin()) showGate(message);
    else hideGate();
  }

  /* ---------- 상태 칩 ---------- */
  var LABEL = {
    off:       { text: '이 기기 저장', cls: 'gray' },
    connecting:{ text: '동기화 중…',   cls: 'blue' },
    online:    { text: '클라우드 연결됨', cls: 'ok' },
    offline:   { text: '오프라인 · 대기중', cls: 'warn' },
    error:     { text: '연결 오류',    cls: 'bad' },
    signedout: { text: '로그아웃됨',   cls: 'gray' }
  };

  function mountStatus() {
    var host = document.querySelector('.topbar-right');
    if (!host || host.querySelector('#sync-chip')) return;
    var chip = document.createElement('button');
    chip.id = 'sync-chip';
    chip.className = 'sync-chip';
    host.insertBefore(chip, host.firstChild);

    chip.addEventListener('click', function () { openPanel(); });

    Sync.onStatus(function (s) {
      // 세션이 끊기면(로그아웃 · 토큰 만료) 다시 로그인 화면을 띄웁니다.
      // 단, 학부모용 공개 화면은 덮지 않습니다.
      if (s === 'signedout' && Sync.isCloud() &&
          !(window.App && App.isPublicRoute && App.isPublicRoute())) {
        showGate(Sync.statusMessage() || '세션이 만료되었습니다. 다시 로그인해 주세요.');
      }
      // 사이드바 하단 안내도 모드에 맞춰 바꿉니다.
      var note = document.getElementById('storage-note');
      if (note && !/저장 불가/.test(note.textContent)) {
        note.textContent = Sync.isCloud() ? '선생님들과 공유 중' : '이 기기에 저장됨';
      }
      var meta = LABEL[s] || LABEL.off;
      var pending = Sync.pendingCount();
      chip.className = 'sync-chip ' + meta.cls;
      chip.textContent = (s === 'off' ? '💾 ' : '☁️ ') + meta.text +
        (pending ? ' (' + pending + ')' : '');
      chip.hidden = false;
    });
  }

  function openPanel() {
    var s = Sync.status();
    var u = Sync.currentUser();
    var cfg = Sync.config();
    UI.modal({
      title: '동기화 상태',
      body:
        '<dl class="kv">' +
          '<dt>모드</dt><dd>' + (Sync.isCloud() ? '클라우드 (여러 기기 공유)' : '이 기기에만 저장') + '</dd>' +
          '<dt>상태</dt><dd>' + U.esc((LABEL[s] || LABEL.off).text) +
            (Sync.statusMessage() ? ' <span class="hint">· ' + U.esc(Sync.statusMessage()) + '</span>' : '') + '</dd>' +
          (u ? '<dt>로그인</dt><dd>' + U.esc(u.email || '') + '</dd>' : '') +
          '<dt>보낼 기록</dt><dd>' + Sync.pendingCount() + '건</dd>' +
          (cfg.lastPulledAt ? '<dt>마지막 수신</dt><dd>' + U.esc(cfg.lastPulledAt.slice(0, 19).replace('T', ' ')) + '</dd>' : '') +
        '</dl>' +
        (Sync.isCloud()
          ? '<p class="hint" style="margin-top:14px">기록은 입력하는 즉시 이 기기에 저장되고, 잠시 뒤 자동으로 다른 선생님 기기에도 전달됩니다. ' +
            '인터넷이 끊겨도 계속 입력할 수 있고 연결되면 밀린 기록이 올라갑니다.</p>'
          : '<p class="hint" style="margin-top:14px">지금은 이 기기에만 저장하는 모드입니다. 여러 선생님이 함께 쓰려면 ' +
            '<b>설정 · 백업</b>에서 클라우드를 연결해 주세요.</p>'),
      footer: (Sync.isCloud()
        ? '<button class="btn" id="sp-out">로그아웃</button><div class="sp"></div>' +
          '<button class="btn primary" id="sp-sync">지금 동기화</button>'
        : '<button class="btn primary" data-close>닫기</button>'),
      onMount: function (w) {
        var sync = w.querySelector('#sp-sync');
        if (sync) sync.addEventListener('click', function () {
          sync.disabled = true; sync.textContent = '동기화 중…';
          Sync.syncNow().then(function () {
            UI.close(); UI.toast('동기화했습니다.');
            if (window.App) App.rerender();
          });
        });
        var out = w.querySelector('#sp-out');
        if (out) out.addEventListener('click', function () {
          UI.close();
          Sync.signOut().then(function () { gate('로그아웃했습니다.'); });
        });
      }
    });
  }

  return { gate: gate, mountStatus: mountStatus, openPanel: openPanel, hideGate: hideGate };
})();

</script>
<script>
/* ===== 대시보드 ===== */
window.Views = window.Views || {};
Views.dashboard = (function () {

  function title() { return '대시보드'; }
  function sub() {
    var o = Store.dayOverview(U.ymd());
    return U.human(o.date) + ' · 오늘 수업 예정 ' + o.expected.length + '명';
  }

  function quickCheck(o) {
    var pending = o.expected.filter(function (s) {
      var r = Store.attendanceFor(s.id, o.date);
      return !r || !r.status;
    });
    if (!o.expected.length) {
      return UI.emptyBox('오늘(' + o.day + '요일)은 예정된 수업이 없습니다.', '🗓️');
    }
    if (!pending.length) {
      return '<div class="empty"><span class="big">✅</span>오늘 출결 체크를 모두 마쳤습니다.<br>' +
        '<span style="font-size:12.5px">출석 ' + o.present + '명 · 결석 ' + o.absent + '명</span></div>';
    }
    return pending.map(function (s) {
      return '<div class="att-row" data-sid="' + s.id + '">' +
        '<div class="att-who">' +
          '<span class="klass-dot" style="background:' + U.esc(Store.scheduleOf(s).color || '#cbd5e0') + '"></span>' +
          '<span><span class="nm">' + U.esc(s.name) + '</span><br>' +
          '<span class="gr">' + U.esc(Store.scheduleOf(s).className || s.grade || '') + '</span></span>' +
        '</div>' +
        '<div class="att-checks">' +
          '<button class="btn sm" data-mark="출석">출석</button>' +
          '<button class="btn sm" data-mark="결석">결석</button>' +
        '</div>' +
        '<div class="att-checks">' +
          '<button class="btn sm ghost" data-mark="출석" data-flag="지각">지각 출석</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  /** 오늘 기록된 수업 태도 */
  function attitudeToday() {
    var list = Store.attendanceOn(U.ymd()).filter(function (r) { return (r.attitude || []).length; });
    if (!list.length) return UI.emptyBox('오늘 기록된 수업 태도가 없습니다.', '🙂');
    // 주의가 필요한 학생을 위로 올립니다.
    list.sort(function (a, b) {
      return ((b.attitude || []).some(Store.isIssue) ? 1 : 0) - ((a.attitude || []).some(Store.isIssue) ? 1 : 0);
    });
    return list.slice(0, 7).map(function (r) {
      var s = Store.student(r.studentId);
      var issue = (r.attitude || []).some(Store.isIssue);
      return '<div class="memo-item">' +
        '<div class="txt"><b>' + U.esc(s ? s.name : '(삭제된 학생)') + '</b> ' +
          '<span class="tag ' + (issue ? 'warn' : 'ok') + '">' + U.esc((r.attitude || []).join(' ')) + '</span>' +
          (r.attitudeNote ? '<br><span style="font-size:12.5px;color:#63778a">' + U.esc(r.attitudeNote) + '</span>' : '') +
        '</div></div>';
    }).join('');
  }

  function taskList(bucket) {
    var list = Store.tasks(bucket);
    if (!list.length) return '<div style="padding:10px 0;color:#93a4b4;font-size:12.5px">할 일이 없습니다.</div>';
    return list.map(function (t) {
      return '<div class="memo-item' + (t.done ? ' done' : '') + '">' +
        '<input type="checkbox" class="cbx" data-task="' + t.id + '"' + (t.done ? ' checked' : '') + '>' +
        '<div class="txt">' + U.esc(t.text) + '</div>' +
        '<button class="x-btn" data-task-del="' + t.id + '" title="삭제">&times;</button>' +
      '</div>';
    }).join('');
  }

  function unpaidList(pay) {
    var list = pay.list.filter(function (p) {
      var k = Store.paymentStatus(p).key;
      return k === 'overdue' || k === 'partial' || k === 'due';
    }).sort(function (a, b) {
      return Store.paymentStatus(b).overdue - Store.paymentStatus(a).overdue;
    });
    if (!pay.list.length) {
      return '<div class="hint">이번 달 청구서가 아직 없습니다. <a href="#/tuition" style="color:#1a7fd4;font-weight:600">청구서를 생성</a>해 주세요.</div>';
    }
    if (!list.length) {
      return '<div class="empty" style="padding:26px 12px"><span class="big">💰</span>이번 달 수강료를 모두 받았습니다.</div>';
    }
    return list.slice(0, 6).map(function (p) {
      var s = Store.student(p.studentId);
      var st = Store.paymentStatus(p);
      var remain = (Number(p.amount) || 0) - (Number(p.paidAmount) || 0);
      return '<div class="memo-item"><div class="txt"><b>' + U.esc(s ? s.name : '') + '</b> ' +
        '<span class="tag ' + st.tag + '">' + U.esc(st.label) + '</span>' +
        '<br><span style="font-size:12px;color:#63778a">' + U.won(remain) + ' · 기한 ' + U.esc(p.dueDate || '-') + '</span></div></div>';
    }).join('') + (list.length > 6 ? '<div class="hint" style="margin-top:8px">외 ' + (list.length - 6) + '명</div>' : '');
  }

  function render(el) {
    var o = Store.dayOverview(U.ymd());
    var all = Store.students();
    var active = all.filter(function (s) { return s.status === '등록생'; });
    var waiting = all.filter(function (s) { return s.status === '대기생'; });
    var resting = all.filter(function (s) { return s.status === '휴원생'; });
    var classCount = Store.classes().length;
    var pay = Store.paymentSummary(U.ym(new Date()));

    el.innerHTML =
      '<div class="stack">' +

      '<div class="grid g-4">' +
        '<div class="stat accent"><div class="lbl">오늘 출석률</div>' +
          '<div class="val">' + o.rate + '<small>%</small></div>' +
          '<div class="sub">출석 ' + o.present + ' · 결석 ' + o.absent + ' · 미체크 ' + o.unmarked + '</div></div>' +
        '<div class="stat"><div class="lbl">등록생</div><div class="val">' + active.length + '<small>명</small></div>' +
          '<div class="sub">대기 ' + waiting.length + ' · 휴원 ' + resting.length + ' · 반 ' + classCount + '개</div></div>' +
        '<div class="stat"><div class="lbl">오늘 수업</div><div class="val">' + o.expected.length + '<small>명</small></div>' +
          '<div class="sub">' + o.day + '요일 수업 예정</div></div>' +
        '<div class="stat"><div class="lbl">이달 수강료 수납률</div><div class="val">' + pay.rate + '<small>%</small></div>' +
          '<div class="sub">' + (pay.outstanding ? '미수납 ' + U.num(pay.outstanding) + '원 · ' + pay.unpaidCount + '명' : '미수납 없음') + '</div></div>' +
      '</div>' +

      '<div class="grid g-21">' +
        '<div class="card"><div class="card-h"><h2>오늘 출결 빠른 체크</h2><div class="sp"></div>' +
          '<a class="btn sm" href="#/attendance">전체 출결표 →</a></div>' +
          '<div class="card-b tight" id="quick">' + quickCheck(o) + '</div></div>' +

        '<div class="card"><div class="card-h"><h2>오늘 수업 태도</h2><div class="sp"></div>' +
          '<a class="btn sm" href="#/attendance">기록하기</a></div>' +
          '<div class="card-b">' + attitudeToday() + '</div></div>' +
      '</div>' +

      '<div class="grid g-21">' +
      '<div class="card"><div class="card-h"><h2>업무 메모</h2><div class="sp"></div>' +
        '<span class="hint">오늘 / 이번주 / 미뤄두기로 나눠 기록하세요</span></div>' +
        '<div class="card-b">' +
          '<div class="row" style="margin-bottom:14px">' +
            '<input type="text" id="task-text" placeholder="할 일을 입력하고 Enter" style="flex:1;min-width:200px">' +
            '<select id="task-bucket" style="width:120px">' +
              '<option value="today">오늘</option><option value="week">이번주</option><option value="later">미뤄두기</option>' +
            '</select>' +
            '<button class="btn primary" id="task-add">추가</button>' +
          '</div>' +
          '<div class="grid g-3">' +
            '<div><div class="section-title">🔥 오늘</div>' + taskList('today') + '</div>' +
            '<div><div class="section-title">📅 이번주</div>' + taskList('week') + '</div>' +
