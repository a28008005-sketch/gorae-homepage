            '<div><div class="section-title">💤 미뤄두기</div>' + taskList('later') + '</div>' +
          '</div>' +
        '</div></div>' +

        '<div class="card"><div class="card-h"><h2>수강료 미납</h2><div class="sp"></div>' +
          '<a class="btn sm" href="#/tuition">납부 관리 →</a></div>' +
          '<div class="card-b">' + unpaidList(pay) + '</div></div>' +
      '</div>' +

      '</div>';

    /* --- 이벤트 --- */
    UI.on(el, '[data-mark]', 'click', function (e, btn) {
      var row = btn.closest('[data-sid]');
      var sid = row.getAttribute('data-sid');
      var patch = { status: btn.getAttribute('data-mark') };
      if (btn.getAttribute('data-flag')) patch.flags = [btn.getAttribute('data-flag')];
      Store.setAttendance(sid, U.ymd(), patch);
      UI.toast(patch.status + ' 체크 완료');
      render(el);
    });

    function addTask() {
      var input = el.querySelector('#task-text');
      var text = input.value.trim();
      if (!text) return;
      Store.addTask(text, el.querySelector('#task-bucket').value);
      input.value = '';
      render(el);
    }
    el.querySelector('#task-add').addEventListener('click', addTask);
    el.querySelector('#task-text').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') addTask();
    });

    UI.on(el, '[data-task]', 'change', function (e, cb) {
      Store.updateTask(cb.getAttribute('data-task'), { done: cb.checked });
      render(el);
    });
    UI.on(el, '[data-task-del]', 'click', function (e, btn) {
      Store.deleteTask(btn.getAttribute('data-task-del'));
      render(el);
    });
  }

  return { title: title, sub: sub, render: render };
})();

</script>
<script>
/* ===== 학생 명부 ===== */
window.Views = window.Views || {};
Views.students = (function () {

  var filter = { q: '', status: '', grade: '', day: '', classId: '' };

  function title() { return '학생 명부'; }
  function sub() {
    var all = Store.students();
    return '등록생 ' + all.filter(function (s) { return s.status === '등록생'; }).length +
      '명 · 전체 ' + all.length + '명';
  }

  /* ---------- 목록 ---------- */
  function matches(s) {
    if (filter.status && s.status !== filter.status) return false;
    if (filter.grade && s.grade !== filter.grade) return false;
    if (filter.classId) {
      if (filter.classId === '__none__') { if (s.classId) return false; }
      else if (s.classId !== filter.classId) return false;
    }
    if (filter.day && Store.scheduleOf(s).days.indexOf(filter.day) < 0) return false;
    if (filter.q) {
      var hay = [s.name, s.grade, s.phone, s.parentPhone, s.parentEmail, s.note].join(' ').toLowerCase();
      if (hay.indexOf(filter.q.toLowerCase()) < 0) return false;
    }
    return true;
  }

  function rows() {
    var list = Store.students().filter(matches);
    if (!list.length) return '<tr><td colspan="8">' + UI.emptyBox('조건에 맞는 학생이 없습니다.', '🔎') + '</td></tr>';
    var today = U.ymd();
    return list.map(function (s) {
      var rec = Store.attendanceFor(s.id, today);
      var sum = Store.summarize(s.id, U.ym(new Date()) + '-01', today);
      var sc = Store.scheduleOf(s);
      return '<tr class="clickable" data-open="' + s.id + '">' +
        '<td class="nm">' + U.esc(s.name) + '</td>' +
        '<td>' + U.esc(s.grade || '-') + '</td>' +
        '<td>' + (sc.className
            ? '<span class="klass-dot" style="background:' + U.esc(sc.color) + '"></span>' + U.esc(sc.className)
            : '<span style="color:#b3c1cd">미배정</span>') + '</td>' +
        '<td>' + U.esc(sc.days.join('·') || '-') + (sc.time ? ' <span class="tag gray">' + U.esc(sc.time) + '</span>' : '') + '</td>' +
        '<td>' + UI.statusTag(s.status) + '</td>' +
        '<td>' + UI.attTag(rec) + '</td>' +
        '<td class="num">' + (sum.total ? sum.rate + '%' : '-') + '</td>' +
        '<td>' + U.esc(U.phone(s.parentPhone) || '-') + '</td>' +
      '</tr>';
    }).join('');
  }

  /* ---------- 등록 / 수정 폼 ---------- */
  function form(s) {
    s = s || {};
    var ac = Store.get().academy;
    return '<div class="form-grid">' +
      '<label class="fld">학생 이름 *<input type="text" id="f-name" value="' + U.esc(s.name || '') + '" placeholder="홍길동"></label>' +
      '<label class="fld">학년<select id="f-grade">' + UI.options(Store.GRADES, s.grade, '선택 안 함') + '</select></label>' +
      '<label class="fld">등록 여부<select id="f-status">' + UI.options(Store.STATUS, s.status || '등록생') + '</select></label>' +
      '<label class="fld">반<select id="f-class"><option value="">반 미배정</option>' +
        Store.classes().map(function (c) {
          return '<option value="' + c.id + '"' + (s.classId === c.id ? ' selected' : '') + '>' +
            U.esc(c.name) + (c.days && c.days.length ? ' (' + U.esc(c.days.join('')) + (c.time ? ' ' + U.esc(c.time) : '') + ')' : '') +
            '</option>';
        }).join('') + '</select></label>' +
      '<label class="fld full" id="own-sched">개인 수업 요일 <span style="font-weight:400">(반에 넣으면 반 시간표를 따릅니다)</span>' +
        '<div class="chips" id="f-days">' + Store.WEEKDAYS.map(function (d) {
          var on = (s.days || []).indexOf(d) >= 0;
          return '<button type="button" class="chip' + (on ? ' on blue' : '') + '" data-day="' + d + '">' + d + '</button>';
        }).join('') + '</div></label>' +
      '<label class="fld">개인 수업 시간<select id="f-time">' + UI.options(ac.times, s.time, '선택 안 함') + '</select></label>' +
      '<label class="fld">학생 연락처<input type="tel" id="f-phone" value="' + U.esc(s.phone || '') + '" placeholder="010-0000-0000"></label>' +
      '<label class="fld">학부모 연락처<input type="tel" id="f-pphone" value="' + U.esc(s.parentPhone || '') + '" placeholder="010-0000-0000"></label>' +
      '<label class="fld">학부모 이메일<input type="email" id="f-pmail" value="' + U.esc(s.parentEmail || '') + '" placeholder="parent@email.com"></label>' +
      '<label class="fld">월 수강료 <span style="font-weight:400">(비우면 기본값 ' + U.num(ac.defaultFee) + '원)</span>' +
        '<input type="number" id="f-fee" step="1000" value="' + (s.fee === undefined || s.fee === '' ? '' : U.esc(s.fee)) + '" placeholder="' + U.num(ac.defaultFee) + '"></label>' +
      '<label class="fld">납부일 <span style="font-weight:400">(매월)</span>' +
        '<input type="number" id="f-bday" min="1" max="31" value="' + (s.billingDay || '') + '" placeholder="' + U.esc(ac.billingDay) + '"></label>' +
      '<label class="fld full">특이사항<textarea id="f-note" placeholder="알레르기, 등하원 방법, 성향 등">' + U.esc(s.note || '') + '</textarea></label>' +
    '</div>';
  }

  function openForm(id) {
    var s = id ? Store.student(id) : null;
    UI.modal({
      title: s ? U.esc(s.name) + ' 정보 수정' : '학생 등록',
      body: form(s),
      footer: (s ? '<button class="btn danger" id="f-del">삭제</button><div class="sp"></div>' : '') +
        '<button class="btn" data-close>취소</button><button class="btn primary" id="f-save">저장</button>',
      onMount: function (w) {
        var days = (s && s.days ? s.days.slice() : []);
        UI.on(w, '[data-day]', 'click', function (e, btn) {
          var d = btn.getAttribute('data-day');
          var i = days.indexOf(d);
          if (i >= 0) { days.splice(i, 1); btn.classList.remove('on', 'blue'); }
          else { days.push(d); btn.classList.add('on', 'blue'); }
        });

        w.querySelector('#f-save').addEventListener('click', function () {
          var name = w.querySelector('#f-name').value.trim();
          if (!name) { UI.toast('학생 이름을 입력해 주세요.', true); return; }
          Store.saveStudent({
            id: s ? s.id : null,
            name: name,
            grade: w.querySelector('#f-grade').value,
            status: w.querySelector('#f-status').value,
            classId: w.querySelector('#f-class').value,
            days: days,
            time: w.querySelector('#f-time').value,
            phone: w.querySelector('#f-phone').value.trim(),
            parentPhone: w.querySelector('#f-pphone').value.trim(),
            parentEmail: w.querySelector('#f-pmail').value.trim(),
            fee: w.querySelector('#f-fee').value === '' ? '' : Number(w.querySelector('#f-fee').value),
            billingDay: w.querySelector('#f-bday').value === '' ? '' : Number(w.querySelector('#f-bday').value),
            note: w.querySelector('#f-note').value.trim()
          });
          UI.close();
          UI.toast(s ? '수정했습니다.' : name + ' 학생을 등록했습니다.');
          App.rerender();
        });

        if (s) {
          w.querySelector('#f-del').addEventListener('click', function () {
            UI.close();
            UI.confirm(
              '<b>' + U.esc(s.name) + '</b> 학생을 삭제할까요?<br>' +
              '<span style="color:#63778a;font-size:13px">출결 · 수강료 · 메모 기록이 모두 함께 삭제되며 되돌릴 수 없습니다.<br>' +
              '기록을 남기려면 대신 등록 여부를 <b>퇴원생</b>으로 바꿔 주세요.</span>',
              function () {
                Store.deleteStudent(s.id);
                UI.toast('삭제했습니다.');
                App.rerender();
              }, { danger: true, yes: '완전 삭제', title: '학생 삭제' }
            );
          });
        }
      }
    });
  }

  /* ---------- 상세 ---------- */
  function openDetail(id) {
    var s = Store.student(id);
    if (!s) return;
    var monthStart = U.ym(new Date()) + '-01';
    var sum = Store.summarize(s.id, monthStart, U.ymd());
    var recent = Store.attendanceRange(s.id, U.daysAgo(30), U.ymd()).slice(-10).reverse();
    var memos = Store.memos(s.id).slice(0, 5);
    var pay = Store.paymentHistory(s.id);
    var sc = Store.scheduleOf(s);

    var body =
      '<div class="grid g-2" style="gap:18px">' +
        '<div><dl class="kv">' +
          '<dt>학년</dt><dd>' + U.esc(s.grade || '-') + '</dd>' +
          '<dt>반</dt><dd>' + (sc.className
              ? '<span class="klass-dot" style="background:' + U.esc(sc.color) + '"></span>' + U.esc(sc.className)
              : '미배정') + '</dd>' +
          '<dt>수업</dt><dd>' + U.esc(sc.days.join('·') || '-') + (sc.time ? ' / ' + U.esc(sc.time) : '') + '</dd>' +
          '<dt>등록 여부</dt><dd>' + UI.statusTag(s.status) + '</dd>' +
          '<dt>학생 연락처</dt><dd>' + U.esc(U.phone(s.phone) || '-') + '</dd>' +
          '<dt>학부모</dt><dd>' + U.esc(U.phone(s.parentPhone) || '-') + '</dd>' +
          '<dt>이메일</dt><dd>' + U.esc(s.parentEmail || '-') + '</dd>' +
          '<dt>월 수강료</dt><dd>' + U.won(Store.feeOf(s)) + ' · 매월 ' +
            (s.billingDay || Store.get().academy.billingDay) + '일</dd>' +
          '<dt>특이사항</dt><dd>' + (s.note ? U.esc(s.note) : '-') + '</dd>' +
        '</dl></div>' +
        '<div>' +
          '<div class="section-title" style="margin-top:0">이번 달 요약</div>' +
          '<div class="report-stats" style="grid-template-columns:repeat(2,1fr)">' +
            '<div class="report-stat"><div class="v">' + sum.rate + '%</div><div class="l">출석률</div></div>' +
            '<div class="report-stat"><div class="v">' + sum.present + '/' + sum.total + '</div><div class="l">출석 / 수업</div></div>' +
            '<div class="report-stat"><div class="v">' + sum.homework + '</div><div class="l">숙제 완료</div></div>' +
            '<div class="report-stat"><div class="v">' + sum.attitudeIssues + '</div><div class="l">태도 주의</div></div>' +
          '</div>' +
          '<div class="hint" style="margin-top:8px">지각 ' + sum.flags['지각'] + ' · 외출 ' + sum.flags['외출'] + ' · 조퇴 ' + sum.flags['조퇴'] + '</div>' +
        '</div>' +
      '</div>' +

      '<div class="section-title">최근 출결 (30일)</div>' +
      (recent.length ? '<div class="table-wrap"><table class="tbl" style="min-width:auto">' +
        '<thead><tr><th>날짜</th><th>출결</th><th>수업 태도</th><th>플래너</th><th>계획실천</th><th>숙제</th><th>비고</th></tr></thead><tbody>' +
        recent.map(function (r) {
          var att = r.attitude || [];
          return '<tr><td>' + U.shortDate(r.date) + '</td><td>' + UI.attTag(r) + '</td>' +
            '<td>' + (att.length
              ? '<span class="tag ' + (att.some(Store.isIssue) ? 'warn' : 'ok') + '">' + U.esc(att.join(' ')) + '</span>'
              : '–') + '</td>' +
            '<td>' + (r.planner ? '✅' : '–') + '</td><td>' + (r.planDone ? '✅' : '–') + '</td>' +
            '<td>' + (r.homework ? '✅' : '–') + '</td><td>' + U.esc(r.note || '') + '</td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<div class="hint">기록이 없습니다.</div>') +

      '<div class="section-title">수강료 납부 이력</div>' +
      (pay.list.length
        ? '<div class="row" style="gap:6px;margin-bottom:8px">' +
            '<span class="tag blue">누적 청구 ' + U.won(pay.billed) + '</span>' +
            '<span class="tag ok">수납 ' + U.won(pay.collected) + '</span>' +
            (pay.outstanding > 0 ? '<span class="tag bad">미수납 ' + U.won(pay.outstanding) + '</span>' : '') +
          '</div>' +
          '<div class="table-wrap"><table class="tbl" style="min-width:auto">' +
          '<thead><tr><th>청구월</th><th class="num">청구액</th><th class="num">납부액</th><th>상태</th><th>납부일</th></tr></thead><tbody>' +
          pay.list.slice(0, 8).map(function (p) {
            var st = Store.paymentStatus(p);
            return '<tr><td>' + U.humanMonth(p.month) + '</td>' +
              '<td class="num">' + U.num(p.amount) + '</td>' +
              '<td class="num">' + U.num(p.paidAmount || 0) + '</td>' +
              '<td><span class="tag ' + st.tag + '">' + U.esc(st.label) + '</span></td>' +
              '<td>' + U.esc(p.paidDate || '-') + '</td></tr>';
          }).join('') + '</tbody></table></div>'
        : '<div class="hint">청구 기록이 없습니다. 수강료 납부 화면에서 청구서를 생성해 주세요.</div>') +

      '<div class="section-title">메모</div>' +
      '<div class="row" style="margin-bottom:8px">' +
        '<input type="text" id="d-memo" placeholder="상담 내용, 학습 특이사항 등" style="flex:1">' +
        '<button class="btn" id="d-memo-add">추가</button></div>' +
      '<div id="d-memo-list">' +
        (memos.length ? memos.map(function (m) {
          return '<div class="memo-item"><span class="dt">' + U.shortDate(m.date) + '</span>' +
            '<div class="txt">' + U.esc(m.text) + '</div>' +
            '<button class="x-btn" data-memo-del="' + m.id + '">&times;</button></div>';
        }).join('') : '<div class="hint">메모가 없습니다.</div>') +
      '</div>';

    UI.modal({
      title: s.name, wide: true, body: body,
      footer: '<button class="btn" id="d-share">학부모 공유 →</button>' +
              '<div class="sp"></div>' +
              '<button class="btn" data-close>닫기</button>' +
              '<button class="btn primary" id="d-edit">정보 수정</button>',
      onMount: function (w) {
        w.querySelector('#d-edit').addEventListener('click', function () { UI.close(); openForm(s.id); });
        w.querySelector('#d-share').addEventListener('click', function () {
          UI.close();
          location.hash = '#/share?student=' + encodeURIComponent(s.id);
        });
        function addMemo() {
          var input = w.querySelector('#d-memo');
          var t = input.value.trim();
          if (!t) return;
          Store.addMemo({ studentId: s.id, text: t });
          UI.close(); openDetail(s.id);
        }
        w.querySelector('#d-memo-add').addEventListener('click', addMemo);
        w.querySelector('#d-memo').addEventListener('keydown', function (e) { if (e.key === 'Enter') addMemo(); });
        UI.on(w, '[data-memo-del]', 'click', function (e, btn) {
          Store.deleteMemo(btn.getAttribute('data-memo-del'));
          UI.close(); openDetail(s.id);
        });
      }
    });
  }

  /* ---------- 렌더 ---------- */
  function render(el) {
    el.innerHTML =
      '<div class="card">' +
        '<div class="card-h">' +
          '<h2>학생 목록</h2><div class="sp"></div>' +
          '<button class="btn" id="csv">CSV 내보내기</button>' +
          '<button class="btn primary" id="add">+ 학생 등록</button>' +
        '</div>' +
        '<div class="card-b" style="padding-bottom:8px">' +
          '<div class="row">' +
            '<input type="search" id="q" placeholder="이름 · 연락처 · 특이사항 검색" value="' + U.esc(filter.q) + '" style="flex:1;min-width:180px">' +
            '<select id="f-st" style="width:120px">' + UI.options(Store.STATUS, filter.status, '전체 상태') + '</select>' +
            '<select id="f-gr" style="width:120px">' + UI.options(Store.GRADES, filter.grade, '전체 학년') + '</select>' +
            '<select id="f-cl" style="width:140px">' +
              UI.options(Store.classes().map(function (c) { return { value: c.id, label: c.name }; })
                .concat([{ value: '__none__', label: '반 미배정' }]), filter.classId, '전체 반') + '</select>' +
            '<select id="f-dy" style="width:110px">' + UI.options(Store.WEEKDAYS, filter.day, '전체 요일') + '</select>' +
          '</div>' +
        '</div>' +
        '<div class="table-wrap"><table class="tbl">' +
          '<thead><tr><th>이름</th><th>학년</th><th>반</th><th>수업</th><th>등록</th><th>오늘 출결</th><th>이달 출석률</th><th>학부모 연락처</th></tr></thead>' +
          '<tbody id="rows">' + rows() + '</tbody>' +
        '</table></div>' +
      '</div>';

    el.querySelector('#add').addEventListener('click', function () { openForm(null); });
    UI.on(el, '[data-open]', 'click', function (e, tr) { openDetail(tr.getAttribute('data-open')); });

    function refresh() { el.querySelector('#rows').innerHTML = rows(); }
    el.querySelector('#q').addEventListener('input', function (e) { filter.q = e.target.value; refresh(); });
    el.querySelector('#f-st').addEventListener('change', function (e) { filter.status = e.target.value; refresh(); });
    el.querySelector('#f-gr').addEventListener('change', function (e) { filter.grade = e.target.value; refresh(); });
    el.querySelector('#f-cl').addEventListener('change', function (e) { filter.classId = e.target.value; refresh(); });
    el.querySelector('#f-dy').addEventListener('change', function (e) { filter.day = e.target.value; refresh(); });

    el.querySelector('#csv').addEventListener('click', function () {
      var head = ['이름', '학년', '반', '요일', '시간', '등록여부', '학생연락처', '학부모연락처',
                  '학부모이메일', '월수강료', '납부일', '특이사항'];
      var body = Store.students().filter(matches).map(function (s) {
        var sc = Store.scheduleOf(s);
        return [s.name, s.grade, sc.className, sc.days.join('·'), sc.time, s.status,
                s.phone, s.parentPhone, s.parentEmail,
                Store.feeOf(s), s.billingDay || Store.get().academy.billingDay, s.note];
      });
      U.download('고래영어_학생명부_' + U.ymd() + '.csv', U.toCsv([head].concat(body)), 'text/csv');
      UI.toast('CSV 파일을 내려받았습니다.');
    });
  }

  return { title: title, sub: sub, render: render, openDetail: openDetail };
})();

</script>
<script>
/* ===== 출결 체크 · 일일 학습 관리 ===== */
window.Views = window.Views || {};
Views.attendance = (function () {

  var date = U.ymd();
  var scope = 'day';   // day = 해당 요일 수업생만, all = 전체 등록생

  function title() { return '출결 · 일일학습 관리'; }
  function sub() { return U.human(date) + ' · 출결과 수업 태도를 한 줄에서 기록합니다'; }

  function targets() {
    return scope === 'day' ? Store.studentsOnDay(U.dayOf(date)) : Store.students({ active: true });
  }

  function row(s) {
    var r = Store.attendanceFor(s.id, date) || {};
    var flags = r.flags || [];
    var attitude = r.attitude || [];
    var sc = Store.scheduleOf(s);
    return '<div class="att-row" data-sid="' + s.id + '">' +
      '<div class="att-who">' +
        '<span class="klass-dot" style="background:' + U.esc(sc.color || '#cbd5e0') + '"></span>' +
        '<span><span class="nm">' + U.esc(s.name) + '</span><br>' +
        '<span class="gr">' + U.esc(sc.className || s.grade || '') +
          (sc.time ? ' · ' + U.esc(sc.time) : '') + '</span></span>' +
      '</div>' +

      '<div class="att-checks">' +
        '<div class="seg">' +
          '<button data-status="출석" class="' + (r.status === '출석' ? 'on' : '') + '">출석</button>' +
          '<button data-status="결석" class="' + (r.status === '결석' ? 'on' : '') + '">결석</button>' +
        '</div>' +
      '</div>' +

      '<div>' +
        '<div class="att-checks" style="margin-bottom:6px">' +
          Store.FLAGS.map(function (f) {
            return '<button class="chip' + (flags.indexOf(f) >= 0 ? ' on warn' : '') + '" data-flag="' + f + '">' + f + '</button>';
          }).join('') +
          '<span style="width:10px"></span>' +
          '<label class="check' + (r.planner ? ' on' : '') + '"><input type="checkbox" data-chk="planner"' + (r.planner ? ' checked' : '') + '>플래너 작성</label>' +
          '<label class="check' + (r.planDone ? ' on' : '') + '"><input type="checkbox" data-chk="planDone"' + (r.planDone ? ' checked' : '') + '>계획 실천</label>' +
          '<label class="check' + (r.homework ? ' on' : '') + '"><input type="checkbox" data-chk="homework"' + (r.homework ? ' checked' : '') + '>숙제</label>' +
        '</div>' +
        '<div class="att-checks att-attitude">' +
          '<span class="att-label">수업 태도</span>' +
          Store.ATTITUDES.map(function (a) {
            var on = attitude.indexOf(a) >= 0;
            var cls = Store.isIssue(a) ? 'warn' : 'mint';
            return '<button class="chip' + (on ? ' on ' + cls : '') + '" data-attitude="' + U.esc(a) + '">' + U.esc(a) + '</button>';
          }).join('') +
        '</div>' +
        '<input type="text" class="mini-note" data-note placeholder="비고 (오늘 학습 내용, 전달 사항)" value="' + U.esc(r.note || '') + '">' +
      '</div>' +
    '</div>';
  }

  function list() {
    var list = targets();
    if (!list.length) {
      return UI.emptyBox(scope === 'day'
        ? U.dayOf(date) + '요일에 수업이 있는 학생이 없습니다. 오른쪽 위에서 [전체 등록생]으로 바꿔보세요.'
        : '등록생이 없습니다. 학생 명부에서 먼저 등록해 주세요.', '🗓️');
    }
    return list.map(row).join('');
  }

  /** 오늘 주의 태도가 찍힌 학생 수 */
  function attitudeIssues() {
    return Store.attendanceOn(date).filter(function (r) {
      return (r.attitude || []).some(Store.isIssue);
    }).length;
  }

  function statBar() {
    var o = Store.dayOverview(date);
    var n = scope === 'day' ? o.expected.length : Store.students({ active: true }).length;
    return '<div class="grid g-4" style="margin-bottom:16px">' +
      '<div class="stat accent"><div class="lbl">출석률</div><div class="val">' + o.rate + '<small>%</small></div>' +
        '<div class="sub">' + U.human(date) + '</div></div>' +
      '<div class="stat"><div class="lbl">출석</div><div class="val">' + o.present + '<small>명</small></div></div>' +
      '<div class="stat"><div class="lbl">결석</div><div class="val">' + o.absent + '<small>명</small></div></div>' +
      '<div class="stat"><div class="lbl">태도 주의</div><div class="val">' + attitudeIssues() + '<small>명</small></div>' +
        '<div class="sub">미체크 ' + o.unmarked + '/' + n + '</div></div>' +
    '</div>';
  }

  function render(el) {
    el.innerHTML =
      '<div id="stats">' + statBar() + '</div>' +
      '<div class="card">' +
        '<div class="card-h">' +
          '<h2>일일 학습 관리표</h2><div class="sp"></div>' +
          '<button class="btn sm" id="prev">‹ 어제</button>' +
          '<input type="date" id="date" value="' + date + '" style="width:150px">' +
          '<button class="btn sm" id="next">내일 ›</button>' +
          '<button class="btn sm" id="today">오늘</button>' +
          '<span style="width:8px"></span>' +
          '<div class="seg">' +
            '<button id="sc-day" class="' + (scope === 'day' ? 'on' : '') + '">요일 수업생</button>' +
            '<button id="sc-all" class="' + (scope === 'all' ? 'on' : '') + '">전체 등록생</button>' +
          '</div>' +
        '</div>' +
        '<div class="card-b" style="padding:10px 14px;border-bottom:1px solid var(--line)">' +
          '<div class="row">' +
            '<button class="btn sm" id="all-present">전원 출석 처리</button>' +
            '<button class="btn sm" id="clear">이 날짜 출결 초기화</button>' +
            '<div class="sp"></div>' +
            '<span class="hint">체크는 입력 즉시 저장됩니다.</span>' +
          '</div>' +
        '</div>' +
        '<div class="card-b tight" id="rows">' + list() + '</div>' +
      '</div>';

    function refresh() {
      el.querySelector('#rows').innerHTML = list();
      el.querySelector('#stats').innerHTML = statBar();
    }
    function go(d) { date = d; App.setSub(sub()); el.querySelector('#date').value = d; refresh(); }

    el.querySelector('#date').addEventListener('change', function (e) { go(e.target.value); });
    el.querySelector('#prev').addEventListener('click', function () { go(U.daysAgo(1, date)); });
    el.querySelector('#next').addEventListener('click', function () { go(U.daysAgo(-1, date)); });
    el.querySelector('#today').addEventListener('click', function () { go(U.ymd()); });
    el.querySelector('#sc-day').addEventListener('click', function () { scope = 'day'; render(el); });
    el.querySelector('#sc-all').addEventListener('click', function () { scope = 'all'; render(el); });

    el.querySelector('#all-present').addEventListener('click', function () {
      var list = targets();
      if (!list.length) return;
      list.forEach(function (s) {
        var r = Store.attendanceFor(s.id, date);
        if (!r || !r.status) Store.setAttendance(s.id, date, { status: '출석' });
      });
      UI.toast('미체크 학생을 모두 출석 처리했습니다.');
      refresh();
    });

    el.querySelector('#clear').addEventListener('click', function () {
      UI.confirm(U.human(date) + '의 출결 기록을 모두 지울까요?', function () {
        var d = Store.get();
        d.attendance = d.attendance.filter(function (a) { return a.date !== date; });
        Store.save();
        UI.toast('초기화했습니다.');
        refresh();
      }, { danger: true, yes: '초기화' });
    });

    /* 행 단위 입력 */
    UI.on(el, '[data-status]', 'click', function (e, btn) {
      var sid = btn.closest('[data-sid]').getAttribute('data-sid');
      var cur = Store.attendanceFor(sid, date);
      var val = btn.getAttribute('data-status');
      Store.setAttendance(sid, date, { status: (cur && cur.status === val) ? '' : val });
      refresh();
    });
    UI.on(el, '[data-flag]', 'click', function (e, btn) {
      var sid = btn.closest('[data-sid]').getAttribute('data-sid');
      Store.toggleFlag(sid, date, btn.getAttribute('data-flag'));
      refresh();
    });
    UI.on(el, '[data-attitude]', 'click', function (e, btn) {
      var sid = btn.closest('[data-sid]').getAttribute('data-sid');
      Store.toggleAttitude(sid, date, btn.getAttribute('data-attitude'));
      refresh();
    });
    UI.on(el, '[data-chk]', 'change', function (e, cb) {
      var sid = cb.closest('[data-sid]').getAttribute('data-sid');
      var patch = {};
      patch[cb.getAttribute('data-chk')] = cb.checked;
      Store.setAttendance(sid, date, patch);
      cb.parentNode.classList.toggle('on', cb.checked);
    });
    UI.on(el, '[data-note]', 'change', function (e, input) {
      var sid = input.closest('[data-sid]').getAttribute('data-sid');
      Store.setAttendance(sid, date, { note: input.value });
      UI.toast('비고를 저장했습니다.');
    });
  }

  return { title: title, sub: sub, render: render };
})();

</script>
<script>
/* ===== 반(클래스) 관리 · 수업 시간표 ===== */
window.Views = window.Views || {};
Views.classes = (function () {

  function title() { return '반 · 시간표'; }
  function sub() {
    var cs = Store.classes();
    var assigned = Store.students({ active: true }).filter(function (s) { return s.classId; }).length;
    return '반 ' + cs.length + '개 · 배정된 학생 ' + assigned + '명';
  }

  /* ---------- 반 카드 ---------- */
  function classCard(c) {
    var members = Store.studentsInClass(c.id);
    var full = c.capacity && members.length >= c.capacity;
    return '<div class="class-card" style="--klass:' + U.esc(c.color || '#1a7fd4') + '">' +
      '<div class="class-top">' +
        '<div>' +
          '<div class="class-name">' + U.esc(c.name) + '</div>' +
          '<div class="class-meta">' +
            (c.days && c.days.length ? U.esc(c.days.join('·')) : '요일 미정') +
            (c.time ? ' · ' + U.esc(c.time) : '') +
            (c.teacher ? ' · ' + U.esc(c.teacher) : '') +
          '</div>' +
        '</div>' +
        '<span class="tag ' + (full ? 'warn' : 'gray') + '">' + members.length +
          (c.capacity ? '/' + c.capacity : '') + '명</span>' +
      '</div>' +
      (c.note ? '<div class="class-note">' + U.esc(c.note) + '</div>' : '') +
      '<div class="class-members">' +
        (members.length
          ? members.map(function (s) {
              return '<span class="pill" data-open="' + s.id + '">' + U.esc(s.name) +
                (s.grade ? ' · ' + U.esc(s.grade.replace('학년', '')) : '') + '</span>';
            }).join('')
          : '<span class="hint">배정된 학생이 없습니다.</span>') +
      '</div>' +
      '<div class="class-actions">' +
        '<button class="btn sm" data-members="' + c.id + '">학생 배정</button>' +
        '<button class="btn sm ghost" data-edit="' + c.id + '">반 수정</button>' +
      '</div>' +
    '</div>';
  }

  /* ---------- 주간 시간표 ---------- */
  function board() {
    var ac = Store.get().academy;
    var cs = Store.classes();
    var days = Store.WEEKDAYS.slice(0, 6);

    var out = '<div class="tt" style="grid-template-columns:74px repeat(' + days.length + ',1fr)">' +
      '<div class="hd"></div>' +
      days.map(function (d) { return '<div class="hd">' + d + '</div>'; }).join('');

    ac.times.forEach(function (t) {
      out += '<div class="tm">' + U.esc(t) + '</div>';
      days.forEach(function (d) {
        var here = cs.filter(function (c) {
          return c.time === t && (c.days || []).indexOf(d) >= 0;
        });
        out += '<div class="cell">' + here.map(function (c) {
          var n = Store.studentsInClass(c.id).length;
          return '<button class="tt-block" data-edit="' + c.id + '" ' +
            'style="--klass:' + U.esc(c.color || '#1a7fd4') + '">' +
            '<b>' + U.esc(c.name) + '</b><span>' + n + '명' +
            (c.teacher ? ' · ' + U.esc(c.teacher) : '') + '</span></button>';
        }).join('') + '</div>';
      });
    });
    return out + '</div>';
  }

  /* ---------- 반 만들기 / 수정 ---------- */
  function openClassForm(id) {
    var c = id ? Store.klass(id) : null;
    var ac = Store.get().academy;
    var colors = Store.CLASS_COLORS;
    var cur = (c && c.color) || colors[Store.classes().length % colors.length];

    UI.modal({
      title: c ? U.esc(c.name) + ' 반 수정' : '반 만들기',
      body:
        '<div class="form-grid">' +
          '<label class="fld">반 이름 *<input type="text" id="k-name" value="' + U.esc(c ? c.name : '') + '" placeholder="예: 파닉스 A반"></label>' +
          '<label class="fld">수업 시간<select id="k-time">' + UI.options(ac.times, c ? c.time : '', '선택 안 함') + '</select></label>' +
          '<label class="fld full">수업 요일' +
            '<div class="chips" id="k-days">' + Store.WEEKDAYS.map(function (d) {
              var on = c && (c.days || []).indexOf(d) >= 0;
              return '<button type="button" class="chip' + (on ? ' on blue' : '') + '" data-day="' + d + '">' + d + '</button>';
            }).join('') + '</div></label>' +
          '<label class="fld">담당 선생님<input type="text" id="k-teacher" value="' + U.esc(c && c.teacher ? c.teacher : '') + '" placeholder="예: 김선생"></label>' +
          '<label class="fld">정원 <span style="font-weight:400">(비우면 제한 없음)</span>' +
            '<input type="number" id="k-cap" min="1" max="40" value="' + (c && c.capacity ? c.capacity : '') + '" placeholder="예: 6"></label>' +
          '<label class="fld full">반 색상' +
            '<div class="chips" id="k-colors">' + colors.map(function (col) {
              return '<button type="button" class="swatch' + (col === cur ? ' on' : '') + '" data-color="' + col + '" ' +
                'style="background:' + col + '" aria-label="' + col + '"></button>';
            }).join('') + '</div></label>' +
          '<label class="fld full">메모<input type="text" id="k-note" value="' + U.esc(c && c.note ? c.note : '') + '" placeholder="교재, 진도 등"></label>' +
        '</div>',
      footer: (c ? '<button class="btn danger" id="k-del">반 삭제</button><div class="sp"></div>' : '') +
        '<button class="btn" data-close>취소</button><button class="btn primary" id="k-save">저장</button>',
      onMount: function (w) {
        var days = (c && c.days ? c.days.slice() : []);
        var color = cur;
        UI.on(w, '[data-day]', 'click', function (e, btn) {
          var d = btn.getAttribute('data-day');
          var i = days.indexOf(d);
          if (i >= 0) { days.splice(i, 1); btn.classList.remove('on', 'blue'); }
          else { days.push(d); btn.classList.add('on', 'blue'); }
        });
        UI.on(w, '[data-color]', 'click', function (e, btn) {
          color = btn.getAttribute('data-color');
          w.querySelectorAll('.swatch').forEach(function (b) { b.classList.remove('on'); });
          btn.classList.add('on');
        });
        w.querySelector('#k-save').addEventListener('click', function () {
          var name = w.querySelector('#k-name').value.trim();
          if (!name) { UI.toast('반 이름을 입력해 주세요.', true); return; }
          var cap = w.querySelector('#k-cap').value;
          Store.saveClass({
            id: c ? c.id : null,
            name: name,
            days: days,
            time: w.querySelector('#k-time').value,
            teacher: w.querySelector('#k-teacher').value.trim(),
            capacity: cap === '' ? '' : Number(cap),
            color: color,
            note: w.querySelector('#k-note').value.trim()
          });
          UI.close();
          UI.toast(c ? '반 정보를 수정했습니다.' : name + ' 반을 만들었습니다.');
          App.rerender();
        });
        if (c) {
          w.querySelector('#k-del').addEventListener('click', function () {
            var n = Store.studentsInClass(c.id).length;
            UI.close();
            UI.confirm('<b>' + U.esc(c.name) + '</b> 반을 삭제할까요?<br>' +
              '<span style="font-size:13px;color:#63778a">' +
              (n ? '소속 학생 ' + n + '명은 반 미배정 상태가 되고, 출결·수강료 기록은 그대로 남습니다.'
                 : '소속 학생이 없어 다른 기록에는 영향이 없습니다.') + '</span>',
              function () {
                Store.deleteClass(c.id);
                UI.toast('반을 삭제했습니다.');
                App.rerender();
              }, { danger: true, yes: '삭제' });
          });
        }
      }
    });
  }

  /* ---------- 학생 배정 ---------- */
  function openMembers(id) {
    var c = Store.klass(id);
    if (!c) return;
    var all = Store.students({ active: true });

    UI.modal({
      title: U.esc(c.name) + ' 학생 배정',
      wide: true,
      body:
        '<p class="hint" style="margin-top:0">이 반에 넣을 학생을 고르세요. 다른 반에 있던 학생을 고르면 이 반으로 옮겨집니다.</p>' +
        '<div class="member-list">' +
          (all.length ? all.map(function (s) {
            var other = s.classId && s.classId !== c.id ? Store.klass(s.classId) : null;
            return '<label class="member-row">' +
              '<input type="checkbox" class="cbx" data-stu="' + s.id + '"' + (s.classId === c.id ? ' checked' : '') + '>' +
              '<span class="member-name">' + U.esc(s.name) + '</span>' +
              '<span class="hint">' + U.esc(s.grade || '') + '</span>' +
              (other ? '<span class="tag gray">' + U.esc(other.name) + '</span>' : '') +
            '</label>';
          }).join('') : UI.emptyBox('등록생이 없습니다.', '🧒')) +
        '</div>',
      footer: '<span class="hint" id="m-count"></span><div class="sp"></div>' +
              '<button class="btn" data-close>취소</button><button class="btn primary" id="m-save">저장</button>',
      onMount: function (w) {
        function refreshCount() {
          var n = w.querySelectorAll('[data-stu]:checked').length;
          w.querySelector('#m-count').textContent = n + '명 선택' +
            (c.capacity ? ' · 정원 ' + c.capacity + '명' : '');
        }
        refreshCount();
        UI.on(w, '[data-stu]', 'change', refreshCount);
        w.querySelector('#m-save').addEventListener('click', function () {
          all.forEach(function (s) {
            var box = w.querySelector('[data-stu="' + s.id + '"]');
            if (!box) return;
            if (box.checked && s.classId !== c.id) Store.saveStudent({ id: s.id, classId: c.id });
            else if (!box.checked && s.classId === c.id) Store.saveStudent({ id: s.id, classId: '' });
          });
          UI.close();
          UI.toast('학생 배정을 저장했습니다.');
          App.rerender();
        });
      }
    });
  }

  /* ---------- 기존 시간표로 반 자동 만들기 ---------- */
  function autoCreate() {
    var groups = {};
    Store.students({ active: true }).forEach(function (s) {
      if (s.classId) return;
      var days = (s.days || []).slice().sort(function (a, b) {
        return Store.WEEKDAYS.indexOf(a) - Store.WEEKDAYS.indexOf(b);
      });
      if (!days.length && !s.time) return;
      var key = days.join('·') + '|' + (s.time || '');
      (groups[key] = groups[key] || { days: days, time: s.time || '', members: [] }).members.push(s);
    });
    var keys = Object.keys(groups);
    if (!keys.length) {
      UI.toast('반으로 묶을 학생이 없습니다. 학생에게 요일·시간이 있어야 합니다.', true);
      return;
    }
    UI.confirm(
      '지금 학생들의 요일·시간을 묶어 반 ' + keys.length + '개를 만들까요?<br>' +
      '<span style="font-size:13px;color:#63778a">' +
      keys.map(function (k) {
        var g = groups[k];
        return '· ' + (g.days.join('·') || '요일없음') + ' ' + (g.time || '') + ' — ' + g.members.length + '명';
      }).join('<br>') +
      '<br><br>만든 뒤 반 이름은 자유롭게 바꾸실 수 있습니다.</span>',
      function () {
        keys.forEach(function (k) {
          var g = groups[k];
          var name = (g.days.join('') || '요일미정') + ' ' + (g.time || '');
          var cid = Store.saveClass({ name: name.trim(), days: g.days, time: g.time });
          g.members.forEach(function (s) { Store.saveStudent({ id: s.id, classId: cid }); });
        });
        UI.toast(keys.length + '개 반을 만들었습니다.');
        App.rerender();
      }, { yes: '만들기' });
  }

  /* ---------- 렌더 ---------- */
  function render(el) {
    var cs = Store.classes();
    var unassigned = Store.students({ active: true }).filter(function (s) { return !s.classId; });

    el.innerHTML =
      '<div class="stack">' +

        '<div class="card">' +
          '<div class="card-h"><h2>반 목록</h2><div class="sp"></div>' +
            (cs.length ? '' : '<button class="btn" id="auto">기존 시간표로 반 만들기</button>') +
            '<button class="btn primary" id="add">+ 반 만들기</button></div>' +
          '<div class="card-b">' +
            (cs.length
              ? '<div class="class-grid">' + cs.map(classCard).join('') + '</div>'
              : UI.emptyBox('아직 만든 반이 없습니다. [+ 반 만들기]로 시작하세요.', '🗓️')) +
          '</div>' +
        '</div>' +

        (cs.length ?
        '<div class="card"><div class="card-h"><h2>주간 시간표</h2><div class="sp"></div>' +
          '<span class="hint">반을 누르면 수정할 수 있습니다</span></div>' +
          '<div class="card-b" style="overflow-x:auto">' + board() + '</div></div>' : '') +

        (unassigned.length ?
        '<div class="card"><div class="card-h"><h2>반 미배정 학생</h2><div class="sp"></div>' +
          '<span class="tag warn">' + unassigned.length + '명</span></div>' +
          '<div class="card-b">' +
            '<p class="hint" style="margin-top:0">반에 넣지 않아도 학생 개인의 요일·시간으로 출결이 잡힙니다. ' +
            '반에 넣으면 반 시간표를 따릅니다.</p>' +
            '<div class="chips" style="margin-top:12px">' +
              unassigned.map(function (s) {
                var sc = Store.scheduleOf(s);
                return '<span class="pill" data-open="' + s.id + '">' + U.esc(s.name) +
                  (sc.days.length ? ' · ' + U.esc(sc.days.join('')) : '') +
                  (sc.time ? ' ' + U.esc(sc.time) : '') + '</span>';
              }).join('') +
            '</div>' +
          '</div></div>' : '') +

      '</div>';

    var add = el.querySelector('#add');
    if (add) add.addEventListener('click', function () { openClassForm(null); });
    var auto = el.querySelector('#auto');
    if (auto) auto.addEventListener('click', autoCreate);

    UI.on(el, '[data-edit]', 'click', function (e, b) { openClassForm(b.getAttribute('data-edit')); });
    UI.on(el, '[data-members]', 'click', function (e, b) { openMembers(b.getAttribute('data-members')); });
    UI.on(el, '[data-open]', 'click', function (e, b) {
      Views.students.openDetail(b.getAttribute('data-open'));
    });
  }

  return { title: title, sub: sub, render: render, openClassForm: openClassForm };
})();

</script>
<script>
/* ===== 수강료 납부 관리 ===== */
window.Views = window.Views || {};
Views.tuition = (function () {

  var month = U.ym(new Date());
  var filter = 'all';   // all | unpaid | paid

  function title() { return '수강료 납부'; }
  function sub() { return U.humanMonth(month) + ' 청구 · 수납 현황'; }

  /* ---------- 목록 ---------- */
  function visible() {
    return Store.payments({ month: month }).filter(function (p) {
      var k = Store.paymentStatus(p).key;
      if (filter === 'unpaid') return k === 'overdue' || k === 'due' || k === 'partial';
      if (filter === 'paid') return k === 'paid' || k === 'exempt';
      return true;
    }).sort(function (a, b) {
      var sa = Store.student(a.studentId), sb = Store.student(b.studentId);
      return U.byName(sa || { name: '' }, sb || { name: '' });
    });
  }

  function rows() {
    var list = visible();
    if (!list.length) {
      return '<tr><td colspan="8">' + UI.emptyBox(
        Store.payments({ month: month }).length
          ? '조건에 맞는 청구 건이 없습니다.'
          : U.humanMonth(month) + ' 청구서가 아직 없습니다. 위의 [청구서 일괄 생성]을 눌러 주세요.', '🧾') + '</td></tr>';
    }
    return list.map(function (p) {
      var s = Store.student(p.studentId);
      var st = Store.paymentStatus(p);
      var paid = Number(p.paidAmount) || 0;
      return '<tr data-pid="' + p.id + '">' +
        '<td class="nm">' + U.esc(s ? s.name : '(삭제된 학생)') + '</td>' +
        '<td>' + U.esc(s && s.grade ? s.grade : '-') + '</td>' +
        '<td class="num">' + U.num(p.amount) + '</td>' +
        '<td class="num">' + (paid ? U.num(paid) : '<span style="color:#b3c1cd">0</span>') + '</td>' +
        '<td><span class="tag ' + st.tag + '">' + U.esc(st.label) + '</span></td>' +
        '<td>' + U.esc(p.dueDate || '-') + '</td>' +
        '<td>' + (p.paidDate ? U.esc(p.paidDate) + (p.method ? ' <span class="tag gray">' + U.esc(p.method) + '</span>' : '') : '-') + '</td>' +
        '<td style="white-space:nowrap">' +
          '<button class="btn sm" data-pay="' + p.id + '">납부 처리</button> ' +
          (paid > 0 ? '<button class="btn sm ghost" data-receipt="' + p.id + '">영수증</button> ' : '') +
          '<button class="x-btn" data-del="' + p.id + '" title="청구 삭제">&times;</button>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  /* ---------- 납부 처리 ---------- */
  function openPay(pid) {
    var p = Store.payments({}).filter(function (x) { return x.id === pid; })[0];
    if (!p) return;
    var s = Store.student(p.studentId);
    var remain = Math.max(0, (Number(p.amount) || 0) - (Number(p.paidAmount) || 0));

    UI.modal({
      title: (s ? s.name : '') + ' · ' + U.humanMonth(p.month) + ' 수강료',
      body:
        '<div class="form-grid">' +
          '<label class="fld">청구 금액<input type="number" id="p-amount" value="' + (Number(p.amount) || 0) + '" step="1000"></label>' +
          '<label class="fld">납부 기한<input type="date" id="p-due" value="' + U.esc(p.dueDate || '') + '"></label>' +
          '<label class="fld">납부 금액<input type="number" id="p-paid" value="' + (Number(p.paidAmount) || 0) + '" step="1000"></label>' +
          '<label class="fld">납부일<input type="date" id="p-date" value="' + U.esc(p.paidDate || U.ymd()) + '"></label>' +
          '<label class="fld">결제 수단<select id="p-method">' +
            UI.options(Store.PAY_METHODS, p.method, '선택 안 함') + '</select></label>' +
          '<label class="fld">&nbsp;<button class="btn mint" id="p-full">전액 납부 입력' +
            (remain ? ' (' + U.num(remain) + '원)' : '') + '</button></label>' +
          '<label class="fld full">비고<input type="text" id="p-note" value="' + U.esc(p.note || '') + '" placeholder="형제 할인, 분납 등"></label>' +
        '</div>',
      footer: '<button class="btn" id="p-unpay">납부 취소</button><div class="sp"></div>' +
              '<button class="btn" data-close>닫기</button><button class="btn primary" id="p-save">저장</button>',
      onMount: function (w) {
        w.querySelector('#p-full').addEventListener('click', function () {
          w.querySelector('#p-paid').value = w.querySelector('#p-amount').value;
          w.querySelector('#p-date').value = w.querySelector('#p-date').value || U.ymd();
        });
        w.querySelector('#p-unpay').addEventListener('click', function () {
          Store.savePayment({ id: p.id, paidAmount: 0, paidDate: '', method: '' });
          UI.close(); UI.toast('납부 기록을 지웠습니다.'); App.rerender();
        });
        w.querySelector('#p-save').addEventListener('click', function () {
          var paidAmount = Number(w.querySelector('#p-paid').value) || 0;
          Store.savePayment({
            id: p.id,
            amount: Number(w.querySelector('#p-amount').value) || 0,
            dueDate: w.querySelector('#p-due').value,
            paidAmount: paidAmount,
            paidDate: paidAmount > 0 ? (w.querySelector('#p-date').value || U.ymd()) : '',
            method: w.querySelector('#p-method').value,
            note: w.querySelector('#p-note').value.trim()
          });
          UI.close();
          UI.toast(paidAmount > 0 ? '납부 처리했습니다.' : '저장했습니다.');
          App.rerender();
        });
      }
    });
  }

  /* ---------- 미납 안내 문자 ---------- */
  function noticeText(p, s) {
    var ac = Store.get().academy;
    var remain = (Number(p.amount) || 0) - (Number(p.paidAmount) || 0);
    var lines = [
      '안녕하세요, ' + ac.name + ' ' + (ac.campus || '') + '입니다.',
      '',
      (s ? s.name : '') + ' 학생 ' + U.humanMonth(p.month) + ' 수강료 안내드립니다.',
      '· 납부 금액: ' + U.won(remain),
      '· 납부 기한: ' + (p.dueDate || '-')
    ];
    if (ac.bankAccount) {
      lines.push('· 입금 계좌: ' + [ac.bankName, ac.bankAccount, ac.bankHolder].filter(Boolean).join(' '));
    }
    lines.push('', '문의: ' + (ac.phone || '') , '감사합니다.');
    return lines.join('\n');
  }

  function openNotice() {
    var unpaid = Store.payments({ month: month }).filter(function (p) {
      var k = Store.paymentStatus(p).key;
      return k === 'overdue' || k === 'due' || k === 'partial';
    });
    if (!unpaid.length) { UI.toast('미납 건이 없습니다.'); return; }

    UI.modal({
      title: U.humanMonth(month) + ' 미납 안내 (' + unpaid.length + '명)',
      wide: true,
      body: unpaid.map(function (p) {
        var s = Store.student(p.studentId);
        var st = Store.paymentStatus(p);
        return '<div style="border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px">' +
          '<div class="row" style="margin-bottom:8px"><b>' + U.esc(s ? s.name : '') + '</b>' +
            '<span class="tag ' + st.tag + '">' + U.esc(st.label) + '</span>' +
            '<span class="hint">' + U.esc(s && s.parentPhone ? U.phone(s.parentPhone) : '연락처 없음') + '</span>' +
            '<div class="sp"></div>' +
            '<button class="btn sm" data-copy-notice="' + p.id + '">문자 내용 복사</button>' +
            (s && s.parentPhone ? '<a class="btn sm" href="sms:' + U.esc(s.parentPhone) + '?body=' +
              encodeURIComponent(noticeText(p, s)) + '">문자 앱으로</a>' : '') +
          '</div>' +
          '<pre style="margin:0;font-family:inherit;font-size:12.5px;color:#63778a;white-space:pre-wrap;line-height:1.6">' +
            U.esc(noticeText(p, s)) + '</pre>' +
        '</div>';
      }).join(''),
      onMount: function (w) {
        UI.on(w, '[data-copy-notice]', 'click', function (e, btn) {
          var p = unpaid.filter(function (x) { return x.id === btn.getAttribute('data-copy-notice'); })[0];
          U.copy(noticeText(p, Store.student(p.studentId)))
            .then(function () { UI.toast('복사했습니다.'); })
            .catch(function () { UI.toast('복사에 실패했습니다.', true); });
        });
      }
    });
  }

  /* ---------- 영수증 ---------- */
  function receiptData(p) {
    var s = Store.student(p.studentId);
    var ac = Store.get().academy;
    return {
      v: 1,
      academy: { name: ac.name, campus: ac.campus, phone: ac.phone, address: ac.address },
      student: { name: s ? s.name : '', grade: s && s.grade ? s.grade : '' },
      month: p.month,
      amount: Number(p.amount) || 0,
      paidAmount: Number(p.paidAmount) || 0,
      paidDate: p.paidDate || '',
      method: p.method || '',
      note: p.note || '',
      issuedAt: U.ymd()
    };
  }

  function receiptHtml(r) {
    var remain = r.amount - r.paidAmount;
    return '<div class="report">' +
      '<div class="report-hd">' +
        '<div style="font-size:12.5px;color:#c9e3f8">🐋 ' + U.esc(r.academy.name) + ' ' + U.esc(r.academy.campus) + '</div>' +
        '<div class="who" style="margin-top:6px">수강료 납부 확인서</div>' +
        '<div class="sub">' + U.humanMonth(r.month) + ' 수강료</div>' +
      '</div>' +
      '<div class="report-bd">' +
        '<dl class="kv" style="grid-template-columns:110px 1fr;font-size:14px">' +
          '<dt>학생</dt><dd><b>' + U.esc(r.student.name) + '</b>' + (r.student.grade ? ' · ' + U.esc(r.student.grade) : '') + '</dd>' +
          '<dt>청구 금액</dt><dd>' + U.won(r.amount) + '</dd>' +
          '<dt>납부 금액</dt><dd><b style="color:#12a05c">' + U.won(r.paidAmount) + '</b></dd>' +
          (remain > 0 ? '<dt>잔액</dt><dd style="color:#d5453f">' + U.won(remain) + '</dd>' : '') +
          '<dt>납부일</dt><dd>' + (r.paidDate ? U.human(r.paidDate) : '-') + '</dd>' +
          '<dt>결제 수단</dt><dd>' + U.esc(r.method || '-') + '</dd>' +
          (r.note ? '<dt>비고</dt><dd>' + U.esc(r.note) + '</dd>' : '') +
        '</dl>' +
        '<p style="margin:22px 0 0;font-size:13.5px;line-height:1.8">위 금액을 정히 영수하였음을 확인합니다.</p>' +
        '<div style="margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:#93a4b4;line-height:1.7">' +
          U.esc(r.academy.name) + ' ' + U.esc(r.academy.campus) + '<br>' +
          U.esc(r.academy.address || '') + (r.academy.phone ? ' · ' + U.esc(r.academy.phone) : '') + '<br>' +
          '발행일 ' + U.esc(r.issuedAt) +
        '</div>' +
      '</div></div>';
  }

  function openReceipt(pid) {
    var p = Store.payments({}).filter(function (x) { return x.id === pid; })[0];
    if (!p) return;
    var r = receiptData(p);
    var url = location.href.split('#')[0] + '#/receipt?d=' + U.encodeData(r);
    UI.modal({
      title: '납부 확인서',
      wide: true,
      body: receiptHtml(r) +
        '<div class="row" style="margin-top:14px">' +
          '<button class="btn primary" id="r-open">새 창에서 열기 · 인쇄</button>' +
          '<button class="btn" id="r-copy">링크 복사</button>' +
        '</div>' +
        '<p class="hint" style="margin-top:10px">링크를 학부모님께 보내면 앱 설치 없이 확인서를 열람·인쇄하실 수 있습니다.</p>',
      onMount: function (w) {
        w.querySelector('#r-open').addEventListener('click', function () { window.open(url, '_blank'); });
        w.querySelector('#r-copy').addEventListener('click', function () {
          U.copy(url).then(function () { UI.toast('링크를 복사했습니다.'); })
            .catch(function () { UI.toast('복사에 실패했습니다.', true); });
        });
      }
    });
  }

  /** 학부모용 읽기 전용 확인서 */
  function renderReceipt(el, encoded) {
    var r = U.decodeData(encoded);
    document.body.classList.add('share-mode');
    if (!r || !r.student) {
      el.innerHTML = '<div class="share-view"><div class="card"><div class="card-b">' +
        UI.emptyBox('확인서를 불러올 수 없습니다. 링크가 잘리지 않았는지 확인해 주세요.', '⚠️') + '</div></div></div>';
      return;
    }
    document.title = r.student.name + ' 수강료 납부 확인서';
    el.innerHTML = '<div class="share-view">' + receiptHtml(r) +
      '<div class="row end no-print" style="margin-top:16px">' +
      '<button class="btn" id="rc-print">인쇄 / PDF 저장</button></div></div>';
    el.querySelector('#rc-print').addEventListener('click', function () { window.print(); });
  }

  /* ---------- 렌더 ---------- */
  function render(el) {
    var sum = Store.paymentSummary(month);
    var ac = Store.get().academy;

    el.innerHTML =
      '<div class="card" style="margin-bottom:16px"><div class="card-b" style="padding:12px 16px">' +
        '<div class="row">' +
          '<b style="font-size:13.5px">청구 월</b>' +
          '<input type="month" id="month" value="' + month + '" style="width:170px">' +
          '<button class="btn primary" id="gen">청구서 일괄 생성</button>' +
          '<div class="sp"></div>' +
          '<div class="seg">' +
            '<button data-f="all" class="' + (filter === 'all' ? 'on' : '') + '">전체</button>' +
            '<button data-f="unpaid" class="' + (filter === 'unpaid' ? 'on' : '') + '">미납</button>' +
            '<button data-f="paid" class="' + (filter === 'paid' ? 'on' : '') + '">완납</button>' +
          '</div>' +
          '<button class="btn" id="notice">미납 안내 문자</button>' +
          '<button class="btn" id="csv">CSV</button>' +
        '</div>' +
      '</div></div>' +

      '<div class="grid g-4" style="margin-bottom:16px">' +
        '<div class="stat accent"><div class="lbl">수납률</div><div class="val">' + sum.rate + '<small>%</small></div>' +
          '<div class="sub">' + U.humanMonth(month) + '</div></div>' +
        '<div class="stat"><div class="lbl">청구 총액</div><div class="val" style="font-size:22px">' + U.num(sum.billed) + '<small>원</small></div>' +
          '<div class="sub">청구 ' + sum.list.length + '건</div></div>' +
        '<div class="stat"><div class="lbl">수납액</div><div class="val" style="font-size:22px;color:#12a05c">' + U.num(sum.collected) + '<small>원</small></div>' +
          '<div class="sub">완납 ' + sum.counts.paid + '명 · 부분 ' + sum.counts.partial + '명</div></div>' +
        '<div class="stat"><div class="lbl">미수납액</div><div class="val" style="font-size:22px;color:' + (sum.outstanding ? '#d5453f' : 'inherit') + '">' +
          U.num(sum.outstanding) + '<small>원</small></div>' +
          '<div class="sub">미납 ' + sum.unpaidCount + '명 · 연체 ' + sum.counts.overdue + '명</div></div>' +
      '</div>' +

      (ac.bankAccount ? '' :
        '<div class="card" style="margin-bottom:16px"><div class="card-b" style="padding:12px 16px">' +
        '<span class="hint">💡 <b>설정 · 백업</b>에서 입금 계좌를 등록하면 미납 안내 문자에 계좌번호가 자동으로 들어갑니다.</span>' +
        '</div></div>') +

      '<div class="card">' +
        '<div class="card-h"><h2>' + U.humanMonth(month) + ' 청구 · 수납 내역</h2></div>' +
        '<div class="table-wrap"><table class="tbl">' +
          '<thead><tr><th>학생</th><th>학년</th><th class="num">청구액</th><th class="num">납부액</th>' +
          '<th>상태</th><th>납부 기한</th><th>납부일</th><th></th></tr></thead>' +
          '<tbody id="rows">' + rows() + '</tbody>' +
        '</table></div>' +
      '</div>';

    function refresh() { render(el); }

    el.querySelector('#month').addEventListener('change', function (e) {
      month = e.target.value || U.ym(new Date());
      App.setSub(sub());
      refresh();
    });

    UI.on(el, '[data-f]', 'click', function (e, btn) {
      filter = btn.getAttribute('data-f');
      refresh();
    });

    el.querySelector('#gen').addEventListener('click', function () {
      var existing = Store.payments({ month: month }).length;
      UI.confirm(
        U.humanMonth(month) + ' 청구서를 등록생 전체에게 생성할까요?<br>' +
        '<span style="font-size:13px;color:#63778a">이미 청구서가 있는 학생은 그대로 두고, 없는 학생만 추가합니다.' +
        (existing ? ' (현재 ' + existing + '건)' : '') + '<br>' +
        '금액은 학생별 수강료가 없으면 학원 기본 수강료(' + U.won(ac.defaultFee) + ')로 들어갑니다.</span>',
        function () {
          var made = Store.generateBills(month);
          UI.toast(made ? made + '건의 청구서를 생성했습니다.' : '새로 생성할 청구서가 없습니다.');
          refresh();
        }, { yes: '생성' });
    });

    el.querySelector('#notice').addEventListener('click', openNotice);

    UI.on(el, '[data-pay]', 'click', function (e, btn) { openPay(btn.getAttribute('data-pay')); });
    UI.on(el, '[data-receipt]', 'click', function (e, btn) { openReceipt(btn.getAttribute('data-receipt')); });
    UI.on(el, '[data-del]', 'click', function (e, btn) {
      UI.confirm('이 청구 건을 삭제할까요?', function () {
        Store.deletePayment(btn.getAttribute('data-del'));
        UI.toast('삭제했습니다.');
        refresh();
      }, { danger: true, yes: '삭제' });
    });

    el.querySelector('#csv').addEventListener('click', function () {
      var head = ['학생', '학년', '청구월', '청구액', '납부액', '잔액', '상태', '납부기한', '납부일', '결제수단', '비고'];
      var body = visible().map(function (p) {
        var s = Store.student(p.studentId);
        var st = Store.paymentStatus(p);
        return [s ? s.name : '', s && s.grade ? s.grade : '', p.month,
                Number(p.amount) || 0, Number(p.paidAmount) || 0,
                (Number(p.amount) || 0) - (Number(p.paidAmount) || 0),
                st.label, p.dueDate, p.paidDate, p.method, p.note];
      });
      U.download('고래영어_수강료_' + month + '.csv', U.toCsv([head].concat(body)), 'text/csv');
      UI.toast('CSV 파일을 내려받았습니다.');
    });
  }

  return { title: title, sub: sub, render: render, renderReceipt: renderReceipt, openPay: openPay };
})();

</script>
<script>
/* ===== 통계 ===== */
window.Views = window.Views || {};
Views.stats = (function () {

  var month = U.ym(new Date());

  function title() { return '통계'; }
  function sub() { return month.replace('-', '년 ') + '월 기준 출석률 · 체크사항 집계'; }

  function range() {
    var days = U.daysInMonth(month);
    return { from: days[0], to: days[days.length - 1] };
  }

  function rowsData() {
    var r = range();
    return Store.students({ active: true }).map(function (s) {
      var sum = Store.summarize(s.id, r.from, r.to);
      return { s: s, sum: sum };
    });
  }

  function monthTotals(data) {
    var t = { present: 0, absent: 0, planner: 0, homework: 0, late: 0, out: 0, early: 0, issues: 0, marked: 0 };
    data.forEach(function (d) {
      t.present += d.sum.present; t.absent += d.sum.absent; t.marked += d.sum.total;
      t.planner += d.sum.planner; t.homework += d.sum.homework;
      t.late += d.sum.flags['지각']; t.out += d.sum.flags['외출']; t.early += d.sum.flags['조퇴'];
      t.issues += d.sum.attitudeIssues;
    });
    return t;
  }

  /** 날짜별 출석률 추이 */
  function trend() {
    var days = U.daysInMonth(month).filter(function (d) { return d <= U.ymd(); });
    var rows = days.map(function (d) {
      var o = Store.dayOverview(d);
      return { date: d, rate: o.rate, marked: o.present + o.absent };
    }).filter(function (r) { return r.marked > 0; });

    if (!rows.length) return UI.emptyBox('이 달에 기록된 출결이 없습니다.', '📈');
    return rows.map(function (r) {
      return UI.bar(U.shortDate(r.date), r.rate, 100, '%');
    }).join('');
  }

  function render(el) {
    var data = rowsData();
    var t = monthTotals(data);
    var lowest = data.filter(function (d) { return d.sum.total > 0; })
      .sort(function (a, b) { return a.sum.rate - b.sum.rate; }).slice(0, 5);

    el.innerHTML =
      '<div class="card" style="margin-bottom:16px"><div class="card-b" style="padding:12px 16px">' +
        '<div class="row"><b style="font-size:13.5px">조회 기간</b>' +
          '<input type="month" id="month" value="' + month + '" style="width:170px">' +
          '<div class="sp"></div>' +
          '<button class="btn sm" id="csv">월간 통계 CSV</button>' +
        '</div></div></div>' +

      '<div class="grid g-4" style="margin-bottom:16px">' +
        '<div class="stat accent"><div class="lbl">전체 출석률</div><div class="val">' + U.pct(t.present, t.marked) + '<small>%</small></div>' +
          '<div class="sub">출석 ' + t.present + ' / 수업 ' + t.marked + '</div></div>' +
        '<div class="stat"><div class="lbl">결석</div><div class="val">' + t.absent + '<small>회</small></div>' +
          '<div class="sub">지각 ' + t.late + ' · 외출 ' + t.out + ' · 조퇴 ' + t.early + '</div></div>' +
        '<div class="stat"><div class="lbl">숙제 이행</div><div class="val">' + U.pct(t.homework, t.marked) + '<small>%</small></div>' +
          '<div class="sub">' + t.homework + '회 완료</div></div>' +
        '<div class="stat"><div class="lbl">태도 주의</div><div class="val">' + t.issues + '<small>일</small></div>' +
          '<div class="sub">졸음 · 이탈 · 휴대폰 · 잡담</div></div>' +
      '</div>' +

      '<div class="grid g-21" style="margin-bottom:16px">' +
        '<div class="card"><div class="card-h"><h2>학생별 출석률</h2></div><div class="card-b">' +
          (data.length ? data.slice().sort(function (a, b) { return b.sum.rate - a.sum.rate; })
            .map(function (d) { return UI.bar(d.s.name, d.sum.total ? d.sum.rate : 0, 100, '%'); }).join('')
            : UI.emptyBox('등록생이 없습니다.', '🧒')) +
        '</div></div>' +

        '<div class="card"><div class="card-h"><h2>관심이 필요한 학생</h2></div><div class="card-b">' +
          (lowest.length ? lowest.map(function (d) {
            return '<div class="memo-item"><div class="txt"><b>' + U.esc(d.s.name) + '</b>' +
              '<br><span style="font-size:12px;color:#63778a">출석률 ' + d.sum.rate + '% · 결석 ' + d.sum.absent +
              '회 · 지각 ' + d.sum.flags['지각'] + '회 · 태도 주의 ' + d.sum.attitudeIssues + '일</span></div></div>';
          }).join('') : '<div class="hint">집계할 출결 기록이 없습니다.</div>') +
        '</div></div>' +
      '</div>' +

      '<div class="card" style="margin-bottom:16px"><div class="card-h"><h2>날짜별 출석률 추이</h2></div>' +
        '<div class="card-b">' + trend() + '</div></div>' +

      '<div class="card"><div class="card-h"><h2>학생별 상세 집계</h2></div>' +
        '<div class="table-wrap"><table class="tbl">' +
          '<thead><tr><th>학생</th><th>반</th><th class="num">수업</th><th class="num">출석</th><th class="num">결석</th>' +
          '<th class="num">출석률</th><th class="num">지각</th><th class="num">외출</th><th class="num">조퇴</th>' +
          '<th class="num">플래너</th><th class="num">숙제</th><th class="num">태도주의</th></tr></thead><tbody>' +
          (data.length ? data.map(function (d) {
            return '<tr class="clickable" data-open="' + d.s.id + '">' +
              '<td class="nm">' + U.esc(d.s.name) + '</td><td>' + U.esc(Store.scheduleOf(d.s).className || '-') + '</td>' +
              '<td class="num">' + d.sum.total + '</td><td class="num">' + d.sum.present + '</td>' +
              '<td class="num">' + d.sum.absent + '</td><td class="num">' + (d.sum.total ? d.sum.rate + '%' : '-') + '</td>' +
              '<td class="num">' + d.sum.flags['지각'] + '</td><td class="num">' + d.sum.flags['외출'] + '</td>' +
              '<td class="num">' + d.sum.flags['조퇴'] + '</td><td class="num">' + d.sum.planner + '</td>' +
              '<td class="num">' + d.sum.homework + '</td><td class="num">' + d.sum.attitudeIssues + '</td></tr>';
          }).join('') : '<tr><td colspan="12">' + UI.emptyBox('등록생이 없습니다.', '🧒') + '</td></tr>') +
        '</tbody></table></div></div>';

    el.querySelector('#month').addEventListener('change', function (e) {
      month = e.target.value || U.ym(new Date());
      App.setSub(sub());
      render(el);
    });

    UI.on(el, '[data-open]', 'click', function (e, tr) {
      Views.students.openDetail(tr.getAttribute('data-open'));
    });

    el.querySelector('#csv').addEventListener('click', function () {
      var head = ['학생', '반', '수업일수', '출석', '결석', '출석률(%)', '지각', '외출', '조퇴', '플래너작성', '숙제완료', '태도주의'];
      var body = rowsData().map(function (d) {
        return [d.s.name, Store.scheduleOf(d.s).className, d.sum.total, d.sum.present, d.sum.absent, d.sum.rate,
                d.sum.flags['지각'], d.sum.flags['외출'], d.sum.flags['조퇴'],
                d.sum.planner, d.sum.homework, d.sum.attitudeIssues];
      });
      U.download('고래영어_월간통계_' + month + '.csv', U.toCsv([head].concat(body)), 'text/csv');
      UI.toast('CSV 파일을 내려받았습니다.');
    });
  }

  return { title: title, sub: sub, render: render };
})();

</script>
<script>
/* ===== 학부모 공유 리포트 =====
 * 노션의 [학부모 공유 페이지 만들기]를 대체합니다.
 * 리포트 데이터를 링크(#/report?d=...) 안에 담아 전달하므로
 * 학부모는 로그인 없이 링크만 열면 아이의 기록을 볼 수 있습니다.
 */
window.Views = window.Views || {};
Views.share = (function () {

  var state = { studentId: '', from: U.daysAgo(29), to: U.ymd(), comment: '' };

  function title() { return '학부모 공유'; }
  function sub() { return '기간별 학습 리포트를 만들어 링크로 전달합니다'; }

  /* ---------- 리포트 데이터 ---------- */
  function build(studentId, from, to, comment) {
    var s = Store.student(studentId);
    if (!s) return null;
    var sum = Store.summarize(studentId, from, to);
    var ac = Store.get().academy;
    return {
      v: 1,
      academy: { name: ac.name, campus: ac.campus, phone: ac.phone, address: ac.address },
      student: { name: s.name, grade: s.grade || '', className: Store.scheduleOf(s).className },
      period: { from: from, to: to },
      stats: {
        total: sum.total, present: sum.present, absent: sum.absent, rate: sum.rate,
        planner: sum.planner, planDone: sum.planDone, homework: sum.homework,
        homeworkRate: sum.homeworkRate, flags: sum.flags, attitudeIssues: sum.attitudeIssues
      },
      records: sum.records.map(function (r) {
        return { d: r.date, s: r.status, f: r.flags || [], p: !!r.planner, c: !!r.planDone, h: !!r.homework, n: r.note || '' };
      }),
      comment: comment || '',
      issuedAt: U.ymd()
    };
  }

  /* ---------- 리포트 HTML (공유 화면과 미리보기가 공용) ---------- */
  function reportHtml(rep) {
    var st = rep.stats;
    var rows = rep.records.length
      ? '<div class="table-wrap"><table class="tbl" style="min-width:auto">' +
        '<thead><tr><th>날짜</th><th>출결</th><th>플래너</th><th>계획실천</th><th>숙제</th><th>선생님 메모</th></tr></thead><tbody>' +
        rep.records.map(function (r) {
          var tag = !r.s ? '<span class="tag gray">-</span>'
            : r.s === '결석' ? '<span class="tag bad">결석</span>'
            : (r.f.length ? '<span class="tag warn">출석 · ' + U.esc(r.f.join('/')) + '</span>' : '<span class="tag ok">출석</span>');
          return '<tr><td>' + U.shortDate(r.d) + '</td><td>' + tag + '</td>' +
            '<td>' + (r.p ? '✅' : '–') + '</td><td>' + (r.c ? '✅' : '–') + '</td>' +
            '<td>' + (r.h ? '✅' : '–') + '</td><td>' + U.esc(r.n) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      : '<div class="hint">이 기간에 기록된 출결이 없습니다.</div>';

    return '<div class="report">' +
      '<div class="report-hd">' +
        '<div style="font-size:12.5px;color:#c9e3f8">🐋 ' + U.esc(rep.academy.name) + ' ' + U.esc(rep.academy.campus) + ' 학습 리포트</div>' +
        '<div class="who" style="margin-top:6px">' + U.esc(rep.student.name) +
          (rep.student.grade ? ' <span style="font-size:14px;font-weight:500">· ' + U.esc(rep.student.grade) + '</span>' : '') +
          (rep.student.className ? ' <span style="font-size:13px;font-weight:500;opacity:.85">· ' + U.esc(rep.student.className) + '</span>' : '') + '</div>' +
        '<div class="sub">' + U.human(rep.period.from) + ' ~ ' + U.human(rep.period.to) + '</div>' +
      '</div>' +
      '<div class="report-bd">' +
        '<div class="report-stats">' +
          '<div class="report-stat"><div class="v">' + st.rate + '%</div><div class="l">출석률</div></div>' +
          '<div class="report-stat"><div class="v">' + st.present + '/' + st.total + '</div><div class="l">출석 / 수업</div></div>' +
          '<div class="report-stat"><div class="v">' + st.homeworkRate + '%</div><div class="l">숙제 이행률</div></div>' +
          '<div class="report-stat"><div class="v">' + st.planner + '</div><div class="l">플래너 작성</div></div>' +
        '</div>' +

        '<div class="row" style="gap:6px;margin-bottom:16px">' +
          '<span class="tag gray">지각 ' + st.flags['지각'] + '회</span>' +
          '<span class="tag gray">외출 ' + st.flags['외출'] + '회</span>' +
          '<span class="tag gray">조퇴 ' + st.flags['조퇴'] + '회</span>' +
          '<span class="tag gray">결석 ' + st.absent + '회</span>' +
        '</div>' +

        (rep.comment
          ? '<div style="background:var(--mint-soft);border-radius:12px;padding:14px 16px;margin-bottom:18px">' +
            '<div style="font-size:12px;font-weight:700;color:#0d8375;margin-bottom:6px">선생님 코멘트</div>' +
            '<div style="font-size:13.5px;line-height:1.7;white-space:pre-wrap">' + U.esc(rep.comment) + '</div></div>'
          : '') +

        '<div class="section-title">기간 내 출결 기록</div>' + rows +

        '<div style="margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:#93a4b4;line-height:1.7">' +
          U.esc(rep.academy.name) + ' ' + U.esc(rep.academy.campus) + '<br>' +
          U.esc(rep.academy.address || '') + (rep.academy.phone ? ' · ' + U.esc(rep.academy.phone) : '') + '<br>' +
          '발행일 ' + U.esc(rep.issuedAt) +
        '</div>' +
      '</div></div>';
  }

  /* ---------- 공유 링크 ---------- */
  function linkFor(rep) {
    var base = location.href.split('#')[0];
    return base + '#/report?d=' + U.encodeData(rep);
  }

  /* ---------- 관리자 화면 ---------- */
  function render(el) {
    var params = App.query();
    if (params.student) { state.studentId = params.student; }

    var list = Store.students();
    if (!state.studentId && list.length) state.studentId = list[0].id;

    el.innerHTML =
      '<div class="grid g-12">' +
        '<div class="card" style="height:fit-content">' +
          '<div class="card-h"><h2>리포트 만들기</h2></div>' +
          '<div class="card-b">' +
            '<label class="fld" style="margin-bottom:12px">학생' +
              '<select id="sh-stu">' + UI.options(list.map(function (s) {
                return { value: s.id, label: s.name + (s.grade ? ' · ' + s.grade : '') };
              }), state.studentId, list.length ? '' : '등록된 학생 없음') + '</select></label>' +
            '<div class="form-grid" style="margin-bottom:12px">' +
              '<label class="fld">시작일<input type="date" id="sh-from" value="' + state.from + '"></label>' +
              '<label class="fld">종료일<input type="date" id="sh-to" value="' + state.to + '"></label>' +
            '</div>' +
            '<div class="chips" style="margin-bottom:12px">' +
              '<button class="chip" data-preset="7">최근 7일</button>' +
              '<button class="chip" data-preset="30">최근 30일</button>' +
              '<button class="chip" data-preset="month">이번 달</button>' +
            '</div>' +
            '<label class="fld" style="margin-bottom:14px">선생님 코멘트' +
              '<textarea id="sh-comment" placeholder="이번 기간 아이의 학습 모습을 한두 문장으로 남겨 주세요." style="min-height:96px">' + U.esc(state.comment) + '</textarea></label>' +
            '<button class="btn primary block" id="sh-make" style="margin-bottom:8px">리포트 생성 · 링크 만들기</button>' +
            '<button class="btn block" id="sh-print">인쇄 / PDF 저장</button>' +
            '<p class="hint" style="margin:14px 0 0">링크에는 <b>학생 이름과 출결 기록만</b> 담깁니다. 연락처는 포함되지 않습니다. ' +
            '링크를 아는 사람은 누구나 열람할 수 있으니 학부모님께만 전달해 주세요.</p>' +
          '</div>' +
        '</div>' +

        '<div id="sh-preview"></div>' +
      '</div>';

    function currentReport() {
      return build(
        el.querySelector('#sh-stu').value,
        el.querySelector('#sh-from').value,
        el.querySelector('#sh-to').value,
        el.querySelector('#sh-comment').value.trim()
      );
    }

    function preview() {
      var rep = currentReport();
      el.querySelector('#sh-preview').innerHTML = rep
        ? reportHtml(rep)
        : '<div class="card"><div class="card-b">' + UI.emptyBox('학생을 먼저 등록해 주세요.', '🧒') + '</div></div>';
    }
    preview();

    ['#sh-stu', '#sh-from', '#sh-to'].forEach(function (sel) {
      el.querySelector(sel).addEventListener('change', preview);
    });
    el.querySelector('#sh-comment').addEventListener('input', function (e) {
      state.comment = e.target.value;
      preview();
    });

    UI.on(el, '[data-preset]', 'click', function (e, btn) {
      var p = btn.getAttribute('data-preset');
      if (p === 'month') {
        el.querySelector('#sh-from').value = U.ym(new Date()) + '-01';
        el.querySelector('#sh-to').value = U.ymd();
      } else {
        el.querySelector('#sh-from').value = U.daysAgo(+p - 1);
        el.querySelector('#sh-to').value = U.ymd();
      }
      preview();
    });

    el.querySelector('#sh-print').addEventListener('click', function () { window.print(); });

    el.querySelector('#sh-make').addEventListener('click', function () {
      var rep = currentReport();
      if (!rep) { UI.toast('학생을 선택해 주세요.', true); return; }
      var url = linkFor(rep);
      var isFile = location.protocol === 'file:';

      UI.modal({
        title: rep.student.name + ' 학부모 공유 링크',
        body:
          '<label class="fld">공유 링크<textarea id="sh-url" readonly style="min-height:110px;font-size:12px;word-break:break-all">' + U.esc(url) + '</textarea></label>' +
          '<div class="row" style="margin-top:12px">' +
            '<button class="btn primary" id="sh-copy">링크 복사</button>' +
            '<button class="btn" id="sh-open">새 창에서 열어보기</button>' +
            (rep.academy.phone ? '<a class="btn" href="sms:?body=' + encodeURIComponent(rep.student.name + ' 학생 학습 리포트입니다.\n' + url) + '">문자로 보내기</a>' : '') +
          '</div>' +
          (isFile
            ? '<p class="hint" style="margin-top:14px;color:#a2610f">지금은 파일을 직접 열어 사용 중이라 링크가 이 컴퓨터에서만 열립니다. ' +
              '홈페이지 주소(whalejinju.kr)로 접속해 만들면 학부모님도 바로 열어보실 수 있습니다.</p>'
            : '<p class="hint" style="margin-top:14px">카카오톡 · 문자로 링크를 전달하세요. 학부모님은 앱 설치나 로그인 없이 바로 열람할 수 있습니다.</p>'),
        onMount: function (w) {
          w.querySelector('#sh-copy').addEventListener('click', function () {
            U.copy(url).then(function () { UI.toast('링크를 복사했습니다.'); })
              .catch(function () { UI.toast('복사에 실패했습니다. 직접 선택해 복사해 주세요.', true); });
          });
          w.querySelector('#sh-open').addEventListener('click', function () { window.open(url, '_blank'); });
        }
      });
    });
  }

  /* ---------- 학부모용 읽기 전용 화면 ---------- */
  function renderReport(el, encoded) {
    var rep = U.decodeData(encoded);
    document.body.classList.add('share-mode');
    if (!rep || !rep.student) {
      el.innerHTML = '<div class="share-view"><div class="card"><div class="card-b">' +
        UI.emptyBox('리포트를 불러올 수 없습니다. 링크가 잘리지 않았는지 확인해 주세요.', '⚠️') +
        '</div></div></div>';
      return;
    }
    document.title = rep.student.name + ' 학습 리포트 · ' + rep.academy.name;
    el.innerHTML = '<div class="share-view">' + reportHtml(rep) +
      '<div class="row end no-print" style="margin-top:16px">' +
        '<button class="btn" id="rp-print">인쇄 / PDF 저장</button></div></div>';
    el.querySelector('#rp-print').addEventListener('click', function () { window.print(); });
  }

  return { title: title, sub: sub, render: render, renderReport: renderReport, build: build, reportHtml: reportHtml };
})();

</script>
<script>
/* ===== 설정 · 백업 ===== */
window.Views = window.Views || {};
Views.settings = (function () {

  function title() { return '설정 · 백업'; }
  function sub() { return '학원 정보와 데이터 관리'; }

  function counts() {
    var d = Store.get();
    return {
      students: d.students.length,
      attendance: d.attendance.length,
      classes: d.classes.length,
      memos: d.memos.length,
      tasks: d.tasks.length,
      payments: d.payments.length
    };
  }

  /** 처음 사용해 보는 원장님을 위한 예시 데이터 */
  function seedSample() {
    // 반 3개 — 학생은 반의 시간표를 따릅니다.
    var classDefs = [
      { name: '파닉스 A반', days: ['월', '수', '금'], time: '3시', teacher: '원장', capacity: 6 },
      { name: '초등 리딩반', days: ['화', '목'], time: '5시', teacher: '원장', capacity: 6 },
      { name: '중등 패턴반', days: ['월', '수', '금'], time: '6시', teacher: '원장', capacity: 5 }
    ];
    var classIds = classDefs.map(function (c) { return Store.saveClass(c); });

    var names = ['김서준', '이하은', '박도윤', '최지우', '정시우', '강예린', '윤하준', '임채원'];
    var grades = ['3학년', '4학년', '4학년', '5학년', '5학년', '6학년', '중1', '중2'];
    var belongs = [0, 1, 0, 1, 0, 1, 2, 2];   // 각 학생이 속한 반
    var dayset = belongs.map(function (b) { return classDefs[b].days; });

    var ids = names.map(function (n, i) {
      return Store.saveStudent({
        name: n, grade: grades[i], status: '등록생',
        classId: classIds[belongs[i]],
        days: [], time: '',
        phone: '', parentPhone: '010-0000-000' + i, parentEmail: '',
        fee: i >= 6 ? 280000 : '', billingDay: '',
        note: ''
      });
    });

    // 최근 3주치 출결을 요일에 맞춰 채웁니다.
    for (var back = 20; back >= 0; back--) {
      var date = U.daysAgo(back);
      var day = U.dayOf(date);
      ids.forEach(function (id, i) {
        if (dayset[i].indexOf(day) < 0) return;
        var roll = Math.random();
        var status = roll > 0.12 ? '출석' : '결석';
        var flags = (status === '출석' && Math.random() > 0.85) ? ['지각'] : [];
        // 수업 태도 — 대부분 집중, 가끔 주의 항목
        var attitude = [];
        if (status === '출석') {
          var r = Math.random();
          if (r > 0.88) attitude = [Store.ATTITUDES[1 + Math.floor(Math.random() * 4)]];
          else if (r > 0.35) attitude = [Store.ATTITUDES[0]];
        }
        Store.setAttendance(id, date, {
          status: status, flags: flags, attitude: attitude,
          attitudeNote: (attitude.length && Store.isIssue(attitude[0])) ? '자리 정돈 후 재집중 안내' : '',
          planner: status === '출석' && Math.random() > 0.25,
          planDone: status === '출석' && Math.random() > 0.35,
          homework: status === '출석' && Math.random() > 0.3,
          note: ''
        });
      });
    }

    // 이번 달 · 지난 달 수강료 청구서와 납부 기록
    [U.ym(U.parseYmd(U.daysAgo(35))), U.ym(new Date())].forEach(function (m, mi) {
      Store.generateBills(m);
      Store.payments({ month: m }).forEach(function (p, i) {
        // 지난 달은 모두 납부, 이번 달은 일부만 납부된 상태로 둡니다.
        var paid = mi === 0 ? true : (i % 3 !== 0);
        if (!paid) return;
        Store.savePayment({
          id: p.id,
          paidAmount: p.amount,
          paidDate: m + '-' + U.pad(Math.min(5 + i, 28)),
          method: i % 2 === 0 ? '계좌이체' : '현금'
        });
      });
    });

    Store.addTask('9월 레벨테스트 예약 학부모 안내', 'today');
    Store.addTask('원서 신간 라이브러리 등록', 'week');
  }

  /** 클라우드 연결 카드 */
  function cloudBox() {
    var cfg = Sync.config();
    if (!Sync.isCloud()) {
      return '<p class="hint" style="margin-top:0">지금은 <b>이 기기에만 저장</b>하는 모드입니다. ' +
        '선생님들이 각자 기기에서 같은 명부와 출결을 보려면 클라우드를 연결하세요. ' +
        '연결해도 기록은 이 기기에 그대로 남고, 인터넷이 끊겨도 계속 입력할 수 있습니다.</p>' +
        '<div class="form-grid" style="margin-top:14px">' +
          '<label class="fld full">Supabase 프로젝트 URL' +
            '<input type="text" id="c-url" placeholder="https://xxxxxxxx.supabase.co"></label>' +
          '<label class="fld full">공개 키 (anon public key)' +
            '<textarea id="c-key" placeholder="eyJhbGciOi..." style="min-height:70px;font-size:12px"></textarea></label>' +
        '</div>' +
        '<div class="row" style="margin-top:12px">' +
          '<button class="btn primary" id="c-connect">클라우드 연결</button>' +
          '<a class="btn" href="https://github.com/a28008005-sketch/gorae-homepage/blob/main/docs/서버형-설치안내.md" target="_blank" rel="noopener">설치 안내 보기</a>' +
        '</div>' +
        '<p class="hint" style="margin-top:12px">⚠️ 여기에는 반드시 <b>anon public</b> 키만 넣으세요. ' +
        'service_role 키는 브라우저에 넣으면 안 됩니다.</p>';
    }
    var u = Sync.currentUser();
    return '<div class="row" style="gap:6px;margin-bottom:12px">' +
        '<span class="tag ok">클라우드 연결됨</span>' +
        (u ? '<span class="tag blue">' + U.esc(u.email || '') + '</span>' : '<span class="tag warn">로그아웃 상태</span>') +
        '<span class="tag gray">보낼 기록 ' + Sync.pendingCount() + '건</span>' +
      '</div>' +
      '<dl class="kv"><dt>서버</dt><dd style="word-break:break-all;font-size:12.5px">' + U.esc(cfg.url) + '</dd></dl>' +
      '<div class="section-title">이 기기의 기록 올리기</div>' +
      '<p class="hint" style="margin-top:0">이 기기에 있는 기록 전체를 클라우드로 올립니다. ' +
      '처음 옮길 때나 백업 파일을 불러온 직후에 한 번만 누르시면 됩니다.</p>' +
      '<div class="row" style="margin-top:12px">' +
        '<button class="btn primary" id="c-upload">전체 올리기</button>' +
